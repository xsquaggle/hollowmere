name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: The committed web app matches src/
        run: npm run verify
      - name: Content check, build, play tests
        run: npm test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-test-screenshots
          path: tests/out/
