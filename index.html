}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--paper);font-family:var(--body);
  touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#lake{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

#hud{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;pointer-events:none;font-variant-numeric:tabular-nums}
.chip{display:flex;align-items:center;gap:7px;background:rgba(27,34,50,.62);border:1px solid rgba(243,234,215,.16);
  padding:6px 11px;border-radius:999px;font-weight:800;font-size:15px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.coin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#F2D896,var(--brass) 60%,#8C6A2E);box-shadow:0 0 0 1.5px #7A5A22 inset}
#coins.bump{animation:bump .35s ease}
@keyframes bump{40%{transform:scale(1.25);color:#F2D896}}
#species,#clock{font-size:13px;font-weight:700;color:rgba(243,234,215,.85)}
@media (max-width:430px){#species{display:none}}
.chip,.btn{white-space:nowrap}
.spacer{flex:1}
.btn{pointer-events:auto;font:800 13px/1 var(--body);letter-spacing:.04em;color:var(--ink);background:var(--paper);
  border:2px solid var(--ink);border-radius:10px;padding:9px 12px;box-shadow:0 3px 0 var(--ink);cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.btn.ghost{background:rgba(243,234,215,.92)}
#hint{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 58px);text-align:center;pointer-events:none;
  font-weight:700;font-size:14px;color:rgba(243,234,215,.88);text-shadow:0 1px 6px rgba(0,0,0,.45);transition:opacity .25s}
#toast{position:fixed;left:16px;right:16px;top:30%;text-align:center;pointer-events:none;font-family:var(--display);
  font-size:28px;color:var(--paper);text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 18px rgba(0,0,0,.35);opacity:0}
#toast.show{animation:toast 1.4s ease forwards}
#toast.big{font-size:46px}
#toast.good{color:#CFE7B9}#toast.warn{color:#F5D08A}#toast.bad{color:#F4A595}#toast.gold{color:#F2D47E}
@keyframes toast{0%{opacity:0;transform:translateY(10px) scale(.9)}12%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.corner{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transition:opacity .2s,transform .2s}
.corner.left{left:16px}.corner.right{right:16px}
.corner.center{left:0;right:0;display:flex;justify-content:center;align-items:flex-end;gap:10px;pointer-events:none}
.map-peek{position:relative;width:66px;height:50px;padding:0;border:0;background:none;cursor:pointer;pointer-events:auto;line-height:0;
  margin-bottom:calc(-14px - env(safe-area-inset-bottom,0px));filter:drop-shadow(0 -4px 8px rgba(0,0,0,.35));transition:transform .25s cubic-bezier(.2,1.5,.4,1);animation:peek 9s 7.5s infinite}
.map-peek:hover,.map-peek:focus-visible{transform:translateY(-8px) rotate(-2deg);outline:none}
.map-peek:active{transform:translateY(-14px)}
.phone-peek{position:relative;width:72px;height:50px;padding:0;border:0;border-radius:20px 20px 0 0;background:#1B1E2A;cursor:pointer;pointer-events:auto;
  margin-bottom:calc(-18px - env(safe-area-inset-bottom,0px));box-shadow:0 0 0 2px #2B2A33,0 -6px 16px rgba(0,0,0,.35);transition:transform .25s cubic-bezier(.2,1.5,.4,1);animation:peek 9s 3s infinite}
.phone-peek:hover,.phone-peek:focus-visible{transform:translateY(-8px);outline:none}
.phone-peek:active{transform:translateY(-14px)}
.pk-notch{position:absolute;top:6px;left:50%;width:22px;height:6px;margin-left:-11px;border-radius:4px;background:#0B0D14}
.pk-glow{position:absolute;left:6px;right:6px;top:15px;bottom:0;border-radius:13px 13px 0 0;background:linear-gradient(#3A93AA,#1F5F72);display:flex;justify-content:center;padding-top:6px}
.pk-logo{width:16px;height:16px;border-radius:50%;border:2px solid rgba(246,241,230,.9);border-top-color:transparent;transform:rotate(-30deg)}
.pk-badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:#D9614C;color:#fff;font:800 11px/18px var(--body);box-shadow:0 0 0 2px #2B2A33}
@keyframes peek{0%,90%,100%{transform:none}93%{transform:translateY(-7px) rotate(-3deg)}96%{transform:translateY(-4px) rotate(3deg)}}
/* Tacklegram: the phone that slides up, its shop app, stat bars and paint swatches */
#phone.fade-out{animation:bgOut .3s ease forwards}
@keyframes bgOut{to{background:rgba(10,13,22,0)}}
.phone.rise{animation:rise .55s cubic-bezier(.16,1.1,.3,1)}
@keyframes rise{from{transform:translateY(100vh)}}
.phone.sink{animation:sink .3s cubic-bezier(.5,0,.8,.4) forwards}
@keyframes sink{to{transform:translateY(100vh)}}
.boot{flex:1;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#14303A;color:#F6F1E6}
.boot-logo{display:grid;justify-items:center;gap:6px;opacity:0;animation:bootIn .35s .6s ease forwards}
.boot-logo b{font:400 26px/1 var(--display)}.boot-logo span{font-size:12px;opacity:.8}
.boot-bar{width:120px;height:4px;border-radius:3px;background:rgba(246,241,230,.2);overflow:hidden;opacity:0;animation:bootIn .2s .7s forwards}
.boot-bar i{display:block;height:100%;width:0;background:#F6F1E6;animation:load .45s .75s ease forwards}
@keyframes bootIn{to{opacity:1}} @keyframes load{to{width:100%}}
.app-in{display:flex;flex-direction:column;min-height:100%;animation:appIn .25s ease}
@keyframes appIn{from{opacity:0;transform:scale(.98)}}
@media (prefers-reduced-motion: reduce){.phone.rise,.phone.sink,.boot-logo,.boot-bar,.boot-bar i,.phone-peek,.map-peek,.book-peek,.bowl-peek,.pan-peek,.app-in{animation-duration:.01s!important;animation-delay:0s!important}}
#phone{position:fixed;inset:0;background:rgba(10,13,22,.55);display:flex;align-items:center;justify-content:center;z-index:7;padding:16px;box-sizing:border-box}
.phone{width:min(330px,100%);height:min(640px,100%);background:#1B1E2A;border-radius:38px;padding:14px 11px 12px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;align-items:center;
  box-shadow:0 0 0 2px #2B2A33,0 20px 50px rgba(0,0,0,.5)}
.phone .notch{width:84px;height:18px;border-radius:12px;background:#0E1018;flex:none}
.phone .home{width:110px;height:6px;border-radius:4px;background:#E8E2D6;border:0;flex:none;cursor:pointer;padding:0}
.phone .home:focus-visible{outline:3px solid var(--brass);outline-offset:3px}
.screen{flex:1;width:100%;background:#F6F1E6;border-radius:26px;overflow:auto;color:var(--ink);touch-action:pan-y;display:flex;flex-direction:column}
.app-head{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#2F7F96;color:#F6F1E6;padding:14px 14px 12px;position:sticky;top:0;z-index:1}
.app-head b{display:block;font:400 22px/1 var(--display)}.app-head span{font-size:11.5px;opacity:.85}
.app-coins{display:flex;align-items:center;gap:6px;font-weight:800;font-variant-numeric:tabular-nums}
.app-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 12px 0}
.app-tabs button{font:800 13px/1 var(--body);padding:9px;border-radius:10px;border:1.5px solid rgba(43,42,51,.2);background:transparent;color:var(--ink);cursor:pointer}
.app-tabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.app-ship{margin:10px 12px 0;padding:8px 10px;border-radius:10px;background:#FBE8C8;font-size:12.5px;font-weight:700}
.app-body{display:grid;gap:10px;padding:10px 12px 16px}
.app-note{margin:0;font-size:12.5px;color:#6B665C}
.app-item{border:1.5px solid rgba(43,42,51,.18);border-radius:12px;padding:10px;display:grid;gap:5px;background:#FFFCF5}
.app-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start}.app-row>div{min-width:0}
.app-item h4{margin:0;font:400 17px/1.15 var(--display)}.app-item p{margin:2px 0 0;font-size:12.5px;line-height:1.35;color:#55514A}
.app-item .perk{color:#3D5A3A;font-weight:700}.app-item .plus{color:#3D6B3A;font-weight:700}
.app-sub{margin:6px 0 0;font:400 17px/1 var(--display)}
.btn.sm{font-size:12px;padding:8px 9px;box-shadow:0 2px 0 var(--ink)}.btn.sm:disabled{opacity:.45}
.tag{font:800 10.5px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:#7A7468;padding:6px 0;white-space:nowrap}.tag.ok{color:#4E7B4C}
.sbar{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#7A7468}
.sbar div{position:relative;height:7px;background:rgba(43,42,51,.12);border-radius:4px}.sbar i{position:absolute;inset:0 auto 0 0;border-radius:4px}
.sbar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:#2B2A33}
.swatches{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.swatch{display:grid;grid-template-columns:28px 1fr;grid-template-rows:auto auto;gap:0 8px;align-items:center;text-align:left;border:1.5px solid rgba(43,42,51,.18);border-radius:12px;padding:8px;background:#FFFCF5;cursor:pointer;font:700 12.5px var(--body);color:var(--ink)}
.swatch i{grid-row:1/3;width:28px;height:28px;border-radius:50%;border:2px solid var(--ink)}.swatch small{color:#7A7468;font-size:11px}
.swatch.on{border-color:var(--ink);border-width:2px}.swatch:disabled{opacity:.5}.corner.center .btn{pointer-events:auto}
/* Map: the paper chart, route and pins */
#mapLayer{position:fixed;inset:0;background:rgba(10,13,22,.62);display:flex;align-items:center;justify-content:center;z-index:6;padding:16px;box-sizing:border-box}
.map-wrap{width:min(370px,100%,46vh);display:grid;gap:12px;justify-items:center}
.paper-box{position:relative;width:100%}
.map-paper{border-radius:4px;overflow:hidden;box-shadow:0 8px 0 #2B2A33,0 18px 40px rgba(0,0,0,.45);animation:unroll .65s cubic-bezier(.2,1,.3,1)}
.map-paper svg{display:block;width:100%;height:auto}
@keyframes unroll{from{clip-path:inset(46% 0 46% 0)}to{clip-path:inset(0 0 0 0)}}
.rod{position:absolute;left:-10px;right:-10px;height:14px;border-radius:7px;background:linear-gradient(#9A6C45,#6A4630 55%,#45301F);box-shadow:0 0 0 2px #2B2A33;z-index:2}
.rod::before,.rod::after{content:'';position:absolute;top:-3px;width:10px;height:20px;border-radius:5px;background:#C9A15A;box-shadow:0 0 0 2px #2B2A33}
.rod::before{left:-6px}.rod::after{right:-6px}
.rod.top{top:-8px;animation:rodTop .65s cubic-bezier(.2,1,.3,1)}.rod.bottom{bottom:-8px;animation:rodBot .65s cubic-bezier(.2,1,.3,1)}
@keyframes rodTop{from{top:calc(50% - 14px)}} @keyframes rodBot{from{bottom:calc(50% - 14px)}}
#mapLayer .map-card{width:100%;box-sizing:border-box;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:10px 12px;
  display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;box-shadow:0 4px 0 var(--ink);animation:appIn .25s ease}
#mapLayer .map-card>div{min-width:0}
#mapLayer .map-card{min-height:96px}
#mapLayer .map-card h3{margin:2px 0 0;font:400 19px/1.1 var(--display)}
#mapLayer .map-card p{margin:3px 0 0;font-size:13px;line-height:1.35;color:#55514A}
#mapLayer .map-card .mini{font-weight:800;color:#3D5A3A}
#mapLayer .map-card .r{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#A07A2E}
#mapLayer .sailing{grid-column:1/-1;margin:0;font-weight:800;color:var(--ink)}
.pin{cursor:pointer;outline:none}.pin.sel{filter:drop-shadow(0 0 3px #C9A15A) drop-shadow(0 0 6px #C9A15A)}
.pin:focus-visible{filter:drop-shadow(0 0 4px #2F7F96)}
#mapLayer.closing{animation:fadeOut .28s forwards}
/* Aquarium: the shack room, tank tabs, the shop below the tanks, fish cards */
#aqua{position:fixed;inset:0;z-index:8;background:#2E2530;animation:aqIn .3s ease;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.aq-stage{position:relative;height:100%;min-height:100%}
.aq-shop{position:relative;min-height:60%;padding:26px 16px calc(env(safe-area-inset-bottom,0px) + 26px);color:var(--paper);
  background:repeating-linear-gradient(180deg,#6E4A33 0 44px,#5E3E2A 44px 46px,#77503A 46px 90px,#5E3E2A 90px 92px);box-shadow:inset 0 14px 18px -10px rgba(0,0,0,.6)}
.aq-shop::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:linear-gradient(#3B281C,#5E3E2A)}
.aq-shop-head{display:grid;gap:2px;margin-bottom:6px}
.aq-shop-head h2{margin:0;font:400 24px/1.1 var(--display)}
.aq-shop-head p{margin:0;font-size:13px;font-weight:700;color:rgba(243,234,215,.85)}
.aq-shop-head .cash{display:flex;align-items:center;gap:6px;color:var(--paper)}
.aq-shop-sub{margin:16px 0 8px;font:800 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:#E9C98A}
.aq-shop-note{font-size:13px;font-weight:700;background:rgba(0,0,0,.2);padding:10px 12px;border-radius:10px}
.aq-items{display:grid;gap:10px}
.aq-item{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:10px;box-shadow:0 3px 0 #2B1D14}
.aq-item .ico{width:48px;height:48px;border-radius:10px;background:#D8E7E4;border:1.5px solid var(--ink);display:grid;place-items:center;overflow:hidden}
.aq-item .ico svg{width:44px;height:44px}
.aq-item .txt{min-width:0;display:grid;gap:2px}
.aq-item h4{margin:0;font:400 16px/1.15 var(--display)}
.aq-item p{margin:0;font-size:12px;line-height:1.35;color:#5C574E}
.aq-item .eff{font-weight:800;color:#3D5A3A}
.aq-item .loved{font-size:11px;color:#8A6A3A;font-weight:700}
.aq-item.own{background:#E6F0D6;border-color:#4E7B4C}
.aq-item.own .ico{background:#CFE3C2}
.aq-item.just{animation:jpulse .7s ease 2}
.aq-up{display:block;width:100%;margin-top:18px}
.aq-card .tip{color:#3D5A3A;font-weight:800}
.coin-badge{background:#C9A15A;color:#2B2A33}
#aqua.closing{animation:fadeOut .25s forwards}
@keyframes aqIn{from{opacity:0;transform:scale(1.04)}}
#aqCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y;display:block}
.aq-top{position:absolute;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;align-items:flex-start;justify-content:space-between;gap:8px;pointer-events:none}
.aq-top h2{margin:0;font:400 26px/1.1 var(--display);color:var(--paper)}
.aq-top p{margin:2px 0 0;color:rgba(243,234,215,.8);font-weight:700;font-size:13px}
.aq-top .btn{pointer-events:auto}
.aq-tabs{position:absolute;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 66px);display:flex;gap:6px}
.aq-tabs button{flex:1;font:800 12.5px/1 var(--body);padding:9px 6px;border-radius:10px;border:1.5px solid rgba(243,234,215,.35);background:rgba(0,0,0,.2);color:var(--paper);cursor:pointer}
.aq-tabs button.on{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.aq-tabs button:disabled{opacity:.5;cursor:default}
.aq-bottom{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:grid;gap:10px}
.aq-bottom .row .btn{flex:1}
.aq-sets{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;touch-action:pan-x}
.aq-set{flex:0 0 200px;display:grid;gap:2px;background:rgba(243,234,215,.94);color:var(--ink);border-radius:10px;padding:8px 10px;border:2px solid var(--ink);font-size:12px}
.aq-set b{font:400 15px/1.1 var(--display)}.aq-set span{color:#6B665C}.aq-set em{font-style:normal;font-weight:800;color:#3D5A3A}
.aq-set.done{background:#E6F0D6;border-color:#4E7B4C}
.aq-card{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:2;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:12px;box-shadow:0 4px 0 var(--ink);display:grid;gap:6px;animation:appIn .2s ease}
.aq-card-top{display:flex;justify-content:space-between;align-items:center}
.aq-card .r{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.aq-card .x{font:400 24px/1 var(--body);background:none;border:0;color:var(--ink);cursor:pointer;padding:0 4px}
.aq-card h3{margin:0;font:400 21px/1.1 var(--display)}.aq-card p{margin:0;font-size:13px;color:#55514A;line-height:1.4}.aq-card .lore{font-style:italic}
.aq-card .row .btn{flex:1}
#cTank{background:none;border:0;padding:2px;font:800 13px var(--body);color:#2F7F96;text-decoration:underline;cursor:pointer;justify-self:center}
@keyframes fadeOut{to{opacity:0}}
/* Settings: sound, save, install */
.st-card{border:1.5px solid rgba(43,42,51,.18);border-radius:12px;padding:12px 14px;margin:0 0 12px;display:grid;gap:8px}
.st-card h3{margin:0;font:400 18px/1.15 var(--display)}
.st-card p{margin:0;font-size:13px;line-height:1.45;color:#55514A}
.st-card .row{margin:0}
.st-card.danger{border-color:rgba(217,97,76,.35)}
.st-dim{color:#8A847A!important;font-size:12px!important}
.st-ok{color:#3D6A3A!important;font-weight:800}
.st-warn{color:#9A5A1E!important;font-weight:800;margin:0 0 10px!important;font-size:13px;line-height:1.45}
.st-card textarea{width:100%;box-sizing:border-box;resize:vertical;border:1.5px solid rgba(43,42,51,.3);border-radius:10px;padding:9px 10px;font:600 12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink);background:#FBF7EE;word-break:break-all;-webkit-user-select:text;user-select:text}
#codeOut{display:grid;gap:8px}
.st-found{display:grid;gap:4px;padding:10px 12px;border-radius:10px;background:#E6F0D6;border:1.5px solid #4E7B4C}
.st-found b{font:400 16px/1.2 var(--display)}.st-found span{font-size:12.5px;font-weight:700;color:#3D5A3A}.st-found .btn{justify-self:start;margin-top:4px}
.st-snaps{display:grid;gap:8px}
.st-snap{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:rgba(43,42,51,.05)}
.st-snap b{display:block;font-size:13px}.st-snap span{display:block;font-size:11.5px;color:#6B665C}.st-snap em{display:block;font-style:normal;font-size:11px;color:#8A847A}
.st-steps{margin:0;padding-left:20px;display:grid;gap:8px;font-size:13.5px;line-height:1.45;color:#3F3C37}
.st-steps li .row{margin-top:6px}
.gl{width:16px;height:16px;vertical-align:-3px;color:#2F7F96}
.in-restore{pointer-events:auto;margin-top:22px;background:none;border:0;color:rgba(243,234,215,.6);font:800 12px var(--body);text-decoration:underline;text-underline-offset:3px;cursor:pointer;animation:inFade 2s 1.8s both}
body.cine #sheet{z-index:70}
.icon-btn .mute-dot{position:absolute;right:-2px;bottom:-2px;width:14px;height:14px;border-radius:50%;background:#D9614C;box-shadow:0 0 0 2px #2B2A33;display:grid;place-items:center}
.icon-btn{position:relative}

/* Opening: deep night sky above the lake, a handwritten letter, then the HUD fades in */
#intro{position:fixed;inset:0;z-index:50;overflow:hidden;color:var(--paper);touch-action:none;cursor:pointer}
#intro.out{animation:fadeOut .6s .25s ease forwards}
.in-sky{position:absolute;left:0;right:0;top:0;height:100%;will-change:transform}
.in-sky canvas{position:absolute;inset:0;display:block}
.in-shade{position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(rgba(6,8,18,.78),rgba(6,8,18,.35) 40%,rgba(6,8,18,.55) 75%,rgba(6,8,18,.85));transition:opacity .6s}
#intro.back .in-shade{opacity:1;animation:inFade .8s both}
#intro.full.titled .in-shade{opacity:1;background:linear-gradient(rgba(6,8,18,.72),rgba(6,8,18,.25) 38%,rgba(6,8,18,0) 55%,rgba(6,8,18,.35));transition:opacity 1.6s}
.in-title{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 11vh);text-align:center;pointer-events:none;padding:0 20px}
.in-title h1{margin:0;font:400 clamp(44px,13.5vw,68px)/1 var(--display);color:#F7EFDD;letter-spacing:.01em;text-shadow:0 2px 0 rgba(0,0,0,.3),0 0 34px rgba(255,214,160,.45)}
.in-title h1 span{display:inline-block;animation:inLet 1.1s cubic-bezier(.2,.9,.25,1) both}

.in-title p{margin:10px auto 0;max-width:300px;font:700 14.5px/1.45 var(--body);color:rgba(243,234,215,.9);text-shadow:0 1px 8px rgba(0,0,0,.6);animation:inFade 1.4s 1.05s both}
.in-title.now h1 span,.in-title.now .in-orn,.in-title.now p{animation-duration:.4s;animation-delay:0s!important}
@keyframes inLet{from{opacity:0;transform:translateY(18px);filter:blur(8px)}}
@keyframes inFade{from{opacity:0}}
.in-gate{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 13vh);text-align:center;pointer-events:none;transition:opacity .6s,transform .6s}
.in-gate.gone{opacity:0;transform:translateY(10px)}
.in-hand{margin:0 0 18px;font:600 30px/1.1 'Caveat','Bradley Hand','Noteworthy','Segoe Print',cursive;color:rgba(247,239,221,.95);animation:inFade 2s .3s both}
.in-tap{margin:0;font:800 13px/1 var(--body);letter-spacing:.24em;text-transform:uppercase;color:rgba(243,234,215,.9);animation:inPulse 2.4s 1s ease-in-out infinite both}
.in-sub{margin:12px 0 0;display:flex;align-items:center;justify-content:center;gap:6px;font:700 12px var(--body);color:rgba(243,234,215,.55);animation:inFade 2s 1.4s both}
@keyframes inPulse{0%,100%{opacity:.45}50%{opacity:1}}
.in-skip{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:16px;background:rgba(6,8,18,.35);color:rgba(243,234,215,.8);border:1px solid rgba(243,234,215,.28);border-radius:999px;padding:7px 14px;font:800 12px var(--body);letter-spacing:.06em;cursor:pointer;animation:inFade .6s both}
.in-letter{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);width:min(340px,calc(100% - 40px));box-sizing:border-box;padding:22px 22px 18px;border-radius:5px;color:#3A2F28;cursor:default;
  background:linear-gradient(180deg,transparent 49.6%,rgba(80,50,20,.08) 50%,transparent 50.6%),repeating-linear-gradient(transparent 0 27px,rgba(90,110,140,.13) 27px 28px),#F4EBD8;background-position:0 0,0 12px,0 0;
  box-shadow:0 22px 50px rgba(0,0,0,.55),0 2px 0 rgba(0,0,0,.18),inset 0 0 40px rgba(160,120,60,.12);transform:translateX(-50%) rotate(-1.6deg);animation:inLetterIn 1s cubic-bezier(.2,1.15,.4,1) both;font:600 min(21px,5.5vw)/28px 'Caveat','Bradley Hand','Noteworthy','Segoe Print',cursive}
.in-letter.away{animation:inLetterOut .6s ease-in forwards}
@keyframes inLetterIn{from{transform:translate(-50%,130%) rotate(7deg)}}
@keyframes inLetterOut{to{transform:translate(-50%,140%) rotate(-9deg);opacity:0}}
.in-letter .ln{display:block;white-space:nowrap;clip-path:inset(0 100% 0 0);-webkit-clip-path:inset(0 100% 0 0);animation:ink var(--d,1s) var(--s,0s) linear forwards}
.in-letter .ln.first{font-size:24px}.in-letter .ln.sig{text-align:right;margin-top:4px;font-size:23px}
@keyframes ink{to{clip-path:inset(0 0 0 0);-webkit-clip-path:inset(0 0 0 0)}}
.in-letter .seal{position:absolute;right:-12px;top:-14px;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#E0745E,#A3392A 62%,#7E271C);box-shadow:0 0 0 3px #A8402F,0 4px 8px rgba(0,0,0,.35),inset 0 -3px 6px rgba(0,0,0,.25);
  color:#F4C7B8;font:400 22px/46px var(--display);text-align:center;transform:rotate(12deg);text-shadow:0 1px 0 rgba(0,0,0,.3)}
.in-go{display:block;width:100%;margin-top:14px;font-size:15px;padding:12px;animation:inFade .6s both}
body.cine #hud,body.cine .corner,body.cine #hint,body.cine #coach,body.cine #toast,body.cine #news{opacity:0!important;pointer-events:none!important}
#hud{transition:opacity .8s}#hint{transition:opacity .4s}
@media (prefers-reduced-motion: reduce){.in-title h1 span,.in-letter,.in-letter .ln,.in-go,.in-tap,.in-hand,.in-sub{animation-duration:.01s!important;animation-delay:0s!important}}
/* News ribbon: small queued notes under the HUD */
#news{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 60px);z-index:60;transform:translate(-50%,-8px);max-width:calc(100% - 40px);box-sizing:border-box;pointer-events:none;opacity:0;
  background:rgba(27,34,50,.86);color:var(--paper);border:1px solid rgba(243,234,215,.22);border-radius:999px;padding:8px 14px;font:800 13px/1.25 var(--body);text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.3);transition:opacity .25s,transform .25s;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#news.show{opacity:1;transform:translate(-50%,0)}#news.hide{opacity:0;transform:translate(-50%,-6px)}
#news.gold{color:#F2D47E;border-color:rgba(242,212,126,.4)}#news.good{color:#CFE7B9}#news.warn{color:#F5D08A}#news.bad{color:#F4A595}
/* small fixes */
.icon-btn{flex-shrink:0}
#hud .chip{flex-shrink:1;min-width:0}

#clock{pointer-events:auto;-webkit-user-select:none;user-select:none}
.aq-peek{justify-self:center;background:none;border:0;color:rgba(243,234,215,.75);font:800 12px var(--body);letter-spacing:.06em;padding:2px 8px;cursor:pointer;animation:inPulse 3s ease-in-out infinite}
#cPB.minor{background:#F3E7C8;border-color:#B08D4C}#cPB.minor b{font-size:18px}

/* Kitchen: a warm smokehouse; stations play on the butcher-block counter, recipe book and cards are paper over wood */
#kitchen{position:fixed;inset:0;z-index:8;background:#2E2018;animation:aqIn .3s ease;overflow:hidden}
#kitchen.closing{animation:fadeOut .25s forwards}
#kCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.k-top{position:absolute;left:0;right:0;top:0;z-index:2;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 10px;display:grid;gap:8px;pointer-events:none;background:linear-gradient(rgba(30,18,10,.78),rgba(30,18,10,0))}
.k-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;min-height:40px}

.k-head p{margin:3px 0 0;font-size:13px;font-weight:700;color:rgba(243,234,215,.82)}
.k-head .btn{pointer-events:auto}
.k-confirm{position:absolute;right:16px;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:3;pointer-events:auto;display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:9px;box-shadow:0 3px 0 var(--ink);max-width:250px;font-size:13px;font-weight:800;line-height:1.3;animation:appIn .2s ease}
.k-confirm span{flex:1 0 100%}
.k-pips{display:flex;gap:4px;width:100%;max-width:560px;justify-self:center}
.k-pip{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;font:800 11px/1 var(--body);letter-spacing:.02em;color:rgba(243,234,215,.72);background:rgba(20,12,6,.45);border:1.5px solid rgba(243,234,215,.2);border-radius:999px;padding:5px 3px;white-space:nowrap;transition:background .25s,color .25s}
.k-pip i{font-style:normal;width:16px;height:16px;flex:0 0 16px;border-radius:50%;display:grid;place-items:center;background:rgba(243,234,215,.2);font-size:9.5px}
.k-pip b{color:#F2D47E;font-variant-numeric:tabular-nums}
.k-pip.on{background:var(--paper);color:var(--ink);border-color:var(--paper)}.k-pip.on i{background:var(--ink);color:var(--paper)}
.k-pip.done{color:var(--paper)}.k-pip.done i{background:#4E7B4C;color:#fff}.k-pip.on.done{color:var(--ink)}
@media (max-width:370px){.k-pip b{display:none}}
.k-ticket{position:absolute;right:14px;z-index:1;width:min(52vw,210px);background:#FBF6EA;color:var(--ink);border:2px solid var(--ink);border-radius:6px 6px 10px 10px;padding:12px 12px 10px;box-shadow:0 4px 0 #2B1D14;transform:rotate(1.6deg);font-size:12.5px;animation:appIn .25s ease}
.k-ticket::before{content:"";position:absolute;top:-7px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#D9614C;border:2px solid var(--ink)}
.k-ticket b{display:block;font:400 14.5px/1.15 var(--display);margin-bottom:6px;padding-bottom:6px;border-bottom:1.5px dashed rgba(43,42,51,.3)}
.k-ticket p{margin:4px 0 0;display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:800}
.k-ticket .dots{display:flex;gap:3px;align-items:center}
.k-ticket .dots i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink);background:#fff}
.k-ticket .dots i.on{background:var(--ink)}
.k-ticket em{font-style:normal;color:#C0432F;font-weight:800}
.k-ticket p.ok{color:#3D6A3A}.k-ticket p.ok .dots i.on{background:#4E7B4C;border-color:#2F4F2D}
.k-ticket p.bad{color:#B4402E}
.k-book{position:absolute;left:0;right:0;bottom:0;overflow-y:auto;-webkit-mask-image:linear-gradient(transparent,#000 16px);mask-image:linear-gradient(transparent,#000 16px);overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:8px 16px calc(env(safe-area-inset-bottom,0px) + 26px);
  background:linear-gradient(rgba(30,18,10,0),rgba(30,18,10,.55) 120px,rgba(30,18,10,.72))}
.k-book>*{max-width:560px;margin-left:auto;margin-right:auto}
.k-now{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:14px;padding:12px;box-shadow:0 3px 0 #2B1D14}
.k-now>div:only-child{grid-column:1/-1}
.k-dish{display:block}
.k-now .k-dish{width:76px;height:76px}
.k-lab{font:800 10.5px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:#8A6A3A}
.k-now h4,.k-rec h4{margin:3px 0 2px;font:400 17px/1.15 var(--display)}
.k-now p,.k-rec p{margin:2px 0 0;font-size:12.5px;line-height:1.35;color:#55514A}
.k-casts{position:relative;height:16px;border-radius:8px;background:rgba(43,42,51,.12);overflow:hidden;margin-top:7px!important}
.k-casts i{position:absolute;left:0;top:0;bottom:0;background:#E9C98A}
.k-casts span{position:relative;display:block;text-align:center;font:800 10.5px/16px var(--body);color:var(--ink)}
.k-h{margin:18px 2px 8px;font:800 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:#E9C98A;display:flex;justify-content:space-between}
.k-h span{color:rgba(243,234,215,.7)}
.k-pantry{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.k-jar{display:grid;justify-items:center;align-content:start;gap:4px;text-align:center;background:rgba(243,234,215,.95);color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:8px 6px;font-size:11.5px;box-shadow:0 3px 0 #2B1D14}
.k-jar .k-dish{width:58px;height:58px}.k-jar b{font:400 12.5px/1.15 var(--display)}.k-jar .btn{padding:6px 12px;font-size:12px;margin-top:2px}
.k-jar.empty{background:rgba(20,12,6,.25);border:2px dashed rgba(243,234,215,.3);color:rgba(243,234,215,.55);min-height:84px;align-content:center;box-shadow:none;font-weight:800}
.k-mini-stars{color:#C99A2E;font-size:12px;letter-spacing:1px;white-space:nowrap}.k-mini-stars s{text-decoration:none;color:rgba(43,42,51,.2)}
.k-recipes{display:grid;gap:10px}
.k-rec{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:10px;box-shadow:0 3px 0 #2B1D14}
.k-rec .k-dish{width:64px;height:64px}
.k-rec.ok{background:#FFF9EC}
.k-rec.locked{grid-template-columns:64px 1fr;background:rgba(243,234,215,.72)}
.k-need{font-weight:800;color:#9A4A36!important}.k-need.have{color:#3D6A3A!important}
.k-meta{font-size:11.5px!important;color:#7A7468!important;font-weight:700}
.k-boost{font-weight:800;color:#8A6A3A!important}
.k-hint{font-style:italic}
.k-foot{margin:16px auto 0!important;font-size:12px;color:rgba(243,234,215,.72);font-weight:700;text-align:center}
.k-bottom{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:grid;gap:10px;justify-items:center;pointer-events:none}
.k-say{margin:0;max-width:420px;text-align:center;background:rgba(243,234,215,.96);color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:10px 14px;font-weight:800;font-size:14px;line-height:1.32;box-shadow:0 3px 0 #2B1D14}
.k-say:empty{display:none}.k-say.pop{animation:appIn .25s ease}
.k-bottom .btn{pointer-events:auto;min-width:190px;font-size:15px;padding:12px 18px}
.k-result{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);max-width:460px;margin:0 auto;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:14px;padding:14px;box-shadow:0 4px 0 var(--ink);display:grid;gap:9px;animation:resIn .4s cubic-bezier(.2,1.2,.4,1)}
@keyframes resIn{from{opacity:0;transform:translateY(40px)}}
.k-stars{display:flex;justify-content:center;gap:4px;margin-top:-38px}
.k-star{position:relative;width:46px;height:46px}
.k-star svg{position:absolute;inset:0;width:46px;height:46px;stroke:var(--ink);stroke-width:1.5;stroke-linejoin:round}
.k-star .bg{fill:#D8CFBD}.k-star .fg{fill:#F2C14E;animation:starIn .5s cubic-bezier(.2,1.7,.4,1) both;filter:drop-shadow(0 0 6px rgba(242,193,78,.7))}
.k-star:nth-child(2){transform:translateY(-8px)}
@keyframes starIn{from{transform:scale(0) rotate(-50deg);opacity:0}}
.k-result h3{margin:0;text-align:center;font:400 22px/1.15 var(--display)}
.k-eff{margin:0;text-align:center;font-weight:800;color:#3D6A3A;font-size:13.5px;line-height:1.35}.k-eff.mush{color:#8A4A6A}
.k-bars{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.k-sb{display:grid;grid-template-columns:50px 1fr 26px;gap:6px;align-items:center;font-size:11.5px;font-weight:800;color:#55514A}
.k-sb i{height:7px;border-radius:4px;background:rgba(43,42,51,.12);overflow:hidden}.k-sb b{display:block;height:100%;background:var(--brass);animation:barIn .9s ease both .25s}
.k-sb em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
@keyframes barIn{from{width:0}}
.k-result .row .btn{flex:1;font-size:14px;padding:11px 10px}
.k-note{margin:0;font-size:12px;color:#7A5A3A;text-align:center;font-weight:700}
.k-banquet{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:grid;gap:10px;justify-items:center;max-width:440px;margin:0 auto}
.k-bq-line{margin:0;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:10px 14px;font-size:14.5px;line-height:1.35;box-shadow:0 3px 0 var(--ink);text-align:center;width:100%;box-sizing:border-box}
.k-bq-line b{display:block;font:800 10.5px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:#8A6A3A;margin-bottom:5px}
.k-bq-line.pop{animation:appIn .3s ease}
.k-banquet .btn{font-size:15px;padding:12px 18px}
.meal-chip{pointer-events:auto;cursor:pointer;font-size:14px;gap:5px;padding:5px 10px 5px 7px}
.meal-chip.mush{background:rgba(160,80,120,.6)}
.meal-chip.pop{animation:bump .4s ease}
@media (max-width:380px){.corner.center{gap:4px}}
@media (prefers-reduced-motion: reduce){#kitchen,.k-result,.k-star .fg,.k-sb b,.k-say.pop,.k-ticket{animation-duration:.01s!important;animation-delay:0s!important}}
@media (prefers-reduced-motion: reduce){.map-paper,.rod.top,.rod.bottom{animation-duration:.01s!important}}
body:not([data-state="idle"]) .corner{opacity:0;transform:translateY(12px);pointer-events:none}
body:not([data-state="idle"]) .corner button{pointer-events:none!important}
.icon-btn{pointer-events:auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink);background:var(--paper);border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);cursor:pointer;padding:0}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.icon-btn:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.icon-btn.off{background:#CFC6B4}
.book-peek,.bowl-peek,.pan-peek{position:relative;padding:0;border:0;background:none;cursor:pointer;pointer-events:auto;line-height:0;
  margin-bottom:calc(-12px - env(safe-area-inset-bottom,0px));filter:drop-shadow(0 -4px 8px rgba(0,0,0,.35));transition:transform .25s cubic-bezier(.2,1.5,.4,1)}
.book-peek{animation:peek 9s 4.5s infinite}.bowl-peek{animation:peek 9s 6s infinite}.pan-peek{animation:peek 9s 1.5s infinite}
.book-peek:hover,.book-peek:focus-visible,.bowl-peek:hover,.bowl-peek:focus-visible,.pan-peek:hover,.pan-peek:focus-visible{transform:translateY(-8px) rotate(-2deg);outline:none}
.book-peek:active,.bowl-peek:active,.pan-peek:active{transform:translateY(-14px)}
#journalBtn.pulse,#aquaBtn.pulse,#kitchenBtn.pulse{animation:jpulse .9s ease 3}
@keyframes jpulse{50%{transform:translateY(-12px) scale(1.08)}}

/* Catch card */
#card{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:min(340px,calc(100% - 32px));
  transform:translateX(-50%);background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:12px;
  padding:14px 16px 16px;box-shadow:0 6px 0 var(--ink),0 18px 40px rgba(0,0,0,.45);display:grid;gap:8px;
  animation:cardIn .45s cubic-bezier(.2,1.4,.4,1)}
#card.out{animation:cardOut .25s ease forwards}
@keyframes cardIn{from{transform:translate(-50%,120%) rotate(-4deg)}}
@keyframes cardOut{to{transform:translate(-50%,130%);opacity:0}}
#card[data-r="uncommon"]{clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px);box-shadow:none;border-color:var(--c-uncommon);border-width:3px}
#card[data-r="rare"]{border:3px double var(--c-rare);background:linear-gradient(115deg,var(--paper) 40%,#E8EEF2 50%,var(--paper) 60%) 0 0/300% 100%;animation:cardIn .45s cubic-bezier(.2,1.4,.4,1),foil 2.4s linear infinite}
#card[data-r="legendary"]{border:4px double var(--c-legendary);background:linear-gradient(115deg,var(--paper) 38%,#F7E3AE 50%,var(--paper) 62%) 0 0/300% 100%;
  box-shadow:0 6px 0 #7A5A22,0 0 0 6px rgba(201,161,90,.35),0 18px 50px rgba(0,0,0,.5);animation:cardIn .6s cubic-bezier(.2,1.4,.4,1),foil 2s linear infinite}
@keyframes foil{to{background-position:-300% 0}}
.card-top{display:flex;align-items:center;gap:8px}
.rarity{font:800 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--c-common);padding:5px 8px;border-radius:6px}
#card[data-r="uncommon"] .rarity{background:var(--c-uncommon)}#card[data-r="rare"] .rarity{background:var(--c-rare)}#card[data-r="legendary"] .rarity{background:var(--c-legendary)}
.stamp{font:800 12px/1 var(--body);letter-spacing:.14em;color:var(--danger);border:2px solid var(--danger);padding:3px 7px;border-radius:4px;transform:rotate(-6deg);animation:stamp .4s .25s cubic-bezier(.3,1.8,.5,1) both}
@keyframes stamp{from{transform:scale(2.2) rotate(-12deg);opacity:0}}
#cFish{width:100%;height:84px;display:block}
.card-top .spacer{flex:1}
.beh{font:800 10.5px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:#7A7468}
.qstars{display:inline-flex;gap:1px;vertical-align:-2px}

.qstars.pop svg.on{animation:qIn .4s cubic-bezier(.3,1.8,.5,1) both}
.qstars.pop svg:nth-child(1){animation-delay:.5s}.qstars.pop svg:nth-child(2){animation-delay:.62s}.qstars.pop svg:nth-child(3){animation-delay:.74s}
@keyframes qIn{from{transform:scale(0) rotate(-60deg)}}
.c-name{position:relative}.c-name.rec h2{padding-right:100px}
#cFish{height:128px!important}
.rec-stamp{position:absolute;right:2px;top:50%;margin-top:-17px;font:800 12px/1.05 var(--body);letter-spacing:.14em;text-transform:uppercase;text-align:center;color:#C0432F;border:2.5px solid #C0432F;border-radius:6px;padding:5px 8px;
  transform:rotate(8deg);box-shadow:inset 0 0 0 1.5px rgba(192,67,47,.35);background:rgba(243,234,215,.55);animation:recStamp .45s 1.5s cubic-bezier(.3,1.9,.5,1) both;pointer-events:none}
@keyframes recStamp{from{transform:scale(2.8) rotate(-10deg);opacity:0}}
#cPB{margin:-2px 0 0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;background:linear-gradient(100deg,#F7E3AE,#F2D47E 60%,#F7E3AE);border:2px solid #7A5A22;border-radius:9px;padding:7px 10px;
  font-weight:800;font-size:12.5px;color:#5A3F12;animation:pbIn .45s 1.55s cubic-bezier(.2,1.4,.4,1) both}
#cPB .t{flex:1 0 100%;font:800 10.5px/1 var(--body);letter-spacing:.12em;text-transform:uppercase}
#cPB b{font:400 22px/1 var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
#cPB em{font-style:normal;color:#7A5A22}
#cPB .bonus{margin-left:auto;font-style:normal;display:inline-flex;align-items:center;gap:4px;color:var(--ink)}
@keyframes pbIn{from{opacity:0;max-height:0;padding-top:0;padding-bottom:0;border-width:0;margin-bottom:-8px}to{max-height:90px}}
.seg{display:flex;gap:3px;padding:3px;border-radius:11px;background:rgba(43,42,51,.09);margin:0 0 12px}
.seg button{flex:1;border:0;background:none;font:800 13px/1 var(--body);padding:9px 8px;border-radius:8px;color:#6B665C;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--paper)}
.seg.units{max-width:220px;margin:0 auto 12px}.seg.units button{font-size:12px;padding:7px}
.j-reg{margin:10px 0 0;font:400 20px/1.1 var(--display);display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 10px}
.j-reg span{font:700 12px var(--body);color:#7A7468}
.rec-hero{display:grid;justify-items:center;text-align:center;gap:3px;padding:14px 14px 12px;border:2px solid var(--ink);border-radius:14px;background:linear-gradient(#FBF3DF,#F2E2B8);box-shadow:0 3px 0 var(--ink);margin:2px 0 14px}
.rec-hero canvas{width:100%;height:104px}
.rec-hero h3{margin:0;font:400 20px/1.15 var(--display)}
.rec-hero .hw{margin:0;font:400 34px/1 var(--display);font-variant-numeric:tabular-nums}
.rec-hero .hl{margin:0;font-weight:800;font-size:14px}
.rec-hero .where,.rec-row .where{margin:4px 0 0;font-size:12px;color:#6B665C;line-height:1.35}
.rec-row{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:center;border:1.5px solid rgba(43,42,51,.2);border-radius:10px;padding:10px}
.rec-row.top{border-color:#C99A2E;background:rgba(242,212,126,.18)}
.rec-row.none{opacity:.6}
.rec-row canvas{width:84px;height:42px}
.rec-row h4{margin:0;font:400 17px/1.15 var(--display)}
.rec-row p{margin:2px 0 0;font-size:13px;color:#55514A}
.rec-row .rw b{font-size:16px;color:var(--ink)}
.rbar{position:relative;height:6px;border-radius:3px;background:rgba(43,42,51,.12);margin:8px 0 3px}
.rbar b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:#E9C24A}
.rbar i{position:absolute;top:-4px;width:3px;height:14px;margin-left:-1.5px;border-radius:2px;background:var(--ink)}
.rlab{display:flex;justify-content:space-between;font-size:10.5px;font-weight:800;color:#8A847A}
.net-rec{font:800 10px/1.4 var(--body);letter-spacing:.08em;white-space:nowrap;display:inline-block;text-transform:uppercase;color:#7A5A22;background:#F2D47E;border:1.5px solid #7A5A22;border-radius:5px;padding:1px 5px;margin-left:4px;vertical-align:1px}

#cName{font:400 26px/1.1 var(--display);margin:0;text-wrap:balance}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-variant-numeric:tabular-nums}
.facts div{display:grid;gap:2px;min-width:0}
.k{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#7A7468}
.facts span:last-child{font-weight:800;font-size:15px}

.card-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card-actions .btn{font-size:15px;padding:12px}
.btn.primary{background:var(--ink);color:var(--paper);box-shadow:0 3px 0 #000}

@keyframes drain{from{width:100%}to{width:0}}
#cAuto{font-size:12px;color:#7A7468;text-align:center;margin:0}

/* Sheets */
#sheet{position:fixed;inset:0;background:rgba(10,13,22,.55);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.panel{width:min(480px,100%);max-height:82%;overflow:auto;background:var(--paper);color:var(--ink);border-radius:16px 16px 0 0;
  border:2px solid var(--ink);border-bottom:0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 20px);box-sizing:border-box;

.panel h2{font:400 26px/1.1 var(--display);margin:0}

.entries{display:grid;gap:10px}
.entry{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;border:1.5px solid rgba(43,42,51,.2);border-radius:10px;padding:10px}
.entry canvas{width:96px;height:48px}
.entry h3{margin:0;font:400 18px/1.15 var(--display)}
.entry p{margin:3px 0 0;font-size:13px;line-height:1.35;color:#55514A}
.entry .r{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.mast{height:5px;background:rgba(43,42,51,.12);border-radius:3px;margin-top:6px;overflow:hidden}
.mast i{display:block;height:100%;background:var(--brass)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;font-variant-numeric:tabular-nums}
.stats div{border:1.5px solid rgba(43,42,51,.2);border-radius:8px;padding:8px}
.stats b{display:block;font-size:20px}
.stats span{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#7A7468}
.tune{display:grid;gap:12px;margin-bottom:16px}
.tune label{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-weight:700;font-size:14px}
.tune input{grid-column:1 / -1;width:100%;accent-color:var(--ink)}
.tune output{font-variant-numeric:tabular-nums;color:#6B665C}
.note{font-size:13px;color:#6B665C;line-height:1.45;margin:0 0 14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
#coach{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 62px);transform:translateX(-50%);width:min(360px,calc(100% - 32px));box-sizing:border-box;
  background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:12px;box-shadow:0 4px 0 var(--ink);padding:10px 14px;pointer-events:none;
  display:flex;gap:10px;align-items:center;animation:coachIn .3s cubic-bezier(.2,1.4,.4,1)}
#coach.warn{background:#F7DFA6}
@keyframes coachIn{from{transform:translate(-50%,-10px);opacity:0}}
#coachStep{font:800 10.5px/1 var(--body);letter-spacing:.1em;color:var(--paper);background:var(--ink);border-radius:6px;padding:5px 6px;white-space:nowrap}
#coachText{margin:0;font-weight:700;font-size:15px;line-height:1.3}
@media (prefers-reduced-motion: reduce){#card,#card.out,.panel,#toast.show,.stamp{animation-duration:.01s!important}}
</style>

</head>

" aria-label="Open kitchen" hidden><svg width="60" height="50" viewBox="0 0 60 50" aria-hidden="true"><path d="M41 17 L56 6" stroke="#2B2A33" stroke-width="8" stroke-linecap="round"/><path d="M41 17 L56 6" stroke="#6E4A33" stroke-width="4.5" stroke-linecap="round"/><ellipse cx="26" cy="33" rx="23" ry="16" fill="#2F2C31" stroke="#2B2A33" stroke-width="1.8"/><ellipse cx="26" cy="32" rx="18" ry="11.5" fill="#4A454D"/><path d="M14 33 q10 -10 22 -2 q-10 9 -22 2 Z" fill="#E8B866" stroke="#2B2A33" stroke-width="1.2"/><path d="M19 30 l3 4 M24 28 l3 5 M29 28 l2.5 5" stroke="#B9762F" stroke-width="1.3" stroke-linecap="round"/><path d="M21 15 q-3 -4 0 -8 M29 14 q-3 -4 0 -8" fill="none" stroke="#F6F1E6" stroke-width="1.7" stroke-linecap="round" opacity=".85"/><path d="M9 28 q3 -6 9 -8" fill="none" stroke="#fff" stroke-width="1.4" opacity=".3" stroke-linecap="round"/></svg></button><button class="map-peek" id="mapBtn" type="button" aria-label="Open map" hidden><svg width="66" height="50" viewBox="0 0 66 50" aria-hidden="true"><rect x="9" y="9" width="48" height="34" fill="#F1E4C6" stroke="#2B2A33" stroke-width="1.6"/><path d="M38 9 C42 18 40 24 46 30 C50 34 48 39 50 43 L57 43 L57 9 Z" fill="#C3D9D7"/><path d="M38 9 C42 18 40 24 46 30 C50 34 48 39 50 43" fill="none" stroke="#2B2A33" stroke-width="1"/><ellipse cx="21" cy="34" rx="7" ry="4.5" fill="#AFCDD2" stroke="#2B2A33" stroke-width="1"/><path d="M26 32 C32 26 36 22 44 17" fill="none" stroke="#B4584A" stroke-width="1.6" stroke-dasharray="2.5 2"/><circle cx="44" cy="17" r="2.4" fill="#C9A15A" stroke="#2B2A33" stroke-width="1"/><path d="M14 20 l3 -5 l3 5 Z M19 20 l3 -6 l3 6 Z" fill="#E4D6B6" stroke="#2B2A33" stroke-width=".8"/><rect x="4" y="4" width="58" height="7" rx="3.5" fill="#7A5236" stroke="#2B2A33" stroke-width="1.6"/><rect x="1" y="2.5" width="6" height="10" rx="3" fill="#C9A15A" stroke="#2B2A33" stroke-width="1.4"/><rect x="59" y="2.5" width="6" height="10" rx="3" fill="#C9A15A" stroke="#2B2A33" stroke-width="1.4"/><rec <script>
(() => {
const $ = id => document.getElementById(id);
const cv = $('lake'), ctx = cv.getContext('2d');
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
const angLerp = (a,b,t) => { let d = ((b-a+Math.PI*3)%(Math.PI*2))-Math.PI; return a + d*clamp(t,0,1); };
const pickW = w => { let s=0; for (const k in w) s+=w[k]; let r=Math.random()*s; for (const k in w){ r-=w[k]; if (r<=0) return k; } return Object.keys(w)[0]; };

const INK='#2B2A33', PAPER='#F3EAD7', BRASS='#C9A15A', DANGER='#D9614C', GOOD='#7FB069';

/* Fish: every species, how it fights, and where it bites.
   FISH[id]   name; rarity (a RAR key); beh (a BEH key); pull (how hard it fights the line);
              reel (seconds of steady reeling with the starter rod); value (coins at an average size);
              size [min, max] real length in cm; len and h (drawn length, and body height as a share of it);
              color and fin; window (seconds to strike after the bite); lore; hint (journal line before it is caught).
   ORDER      the lake journal's order.  REGION_FISH  which species live in each region, in journal order.
   POOLS      lake bite weights per spot; POOLS_COAST the same for Gullrock Coast. Night, dawn, rods,
              meals and tank sets adjust them in poolFor().  SPOT_NAME  what each spot is called. */
const FISH = {
  perch:   {name:'Copper Perch', rarity:'common', beh:'darter', pull:0.9, reel:2.6, value:2, size:[14,26], len:34, h:.27, color:'#D08A4E', fin:'#A85E2C', window:1.4,
            lore:'Its belly often holds old coins. Nobody knows who keeps dropping them.', hint:'Common in open water.'},
  reedwhisker:{name:'Reedwhisker', rarity:'common', beh:'tugger', pull:1.0, reel:3.2, value:3, size:[22,40], len:40, h:.24, color:'#8A7558', fin:'#62513C', window:1.3,
            lore:"A grumpy catfish that tugs like it's ringing a doorbell.", hint:'Lurks along the reed edges.'},
  lantern: {name:'Lantern Carp', rarity:'uncommon', beh:'sleeper', pull:.7, reel:3.6, value:12, size:[25,45], len:42, h:.32, color:'#E2A64F', fin:'#B97A2F', window:1.6,

  leafjack:{name:'Leafjack', rarity:'uncommon', beh:'leaper', pull:1.0, reel:4.2, value:15, size:[20,34], len:40, h:.36, color:'#A9B456', fin:'#7C8C33', window:1.1,
            lore:'Disguises itself as a leaf. It fools the birds, but not you.', hint:'Seen hiding under the lily pads.'},
  mossback:{name:'Mossback', rarity:'rare', beh:'sulker', pull:1.35, reel:7, value:45, size:[40,70], len:56, h:.3, color:'#6C805A', fin:'#4E6243', window:.9,

  o.type='sawtooth'; o.frequency.value=90; f.type='lowpass'; f.frequency.value=600; g.gain.value=0; o.connect(f); f.connect(g); g.connect(master); o.start(); hum={o,g}; }
function humStop(){ if (!hum) return; const h=hum; hum=null; try { h.g.gain.setTargetAtTime(0,AC.currentTime,.03); h.o.stop(AC.currentTime+.2); } catch(e){} }

/* ---------- Layout ---------- */
let W=0, H=0, DPR=1, HZ=0; const G={};
let seed=11; const srand=()=>{ seed=(seed*16807)%2147483647; return (seed-1)/2147483646; };
const TREES=[]; for (let i=0;i<=44;i++) TREES.push(srand());
const SHIM=[]; for (let i=0;i<46;i++) SHIM.push({fy:Math.pow(Math.random(),1.3), fx:Math.random(), len:rand(.03,.09), ph:rand(0,6.28), sp:rand(.4,1.2)});
const REEDS=[]; for (let i=0;i<16;i++) REEDS.push({side:i<10?0:1, fx:rand(0,1), h:rand(.6,1), ph:rand(0,6.28)});
function resize(){
  const r=cv.getBoundingClientRect(); W=r.width; H=r.height; DPR=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  HZ=Math.round(H*.25);
  G.deep={x:W*.64, y:HZ+(H-HZ)*.3, rx:W*.19, ry:(H-HZ)*.075};
  G.pads={x:W*.26, y:HZ+(H-HZ)*.53, r:W*.13};
  G.player={x:W/2, y:H-104};
  G.rodBase={x:W/2+13, y:H-146};
  G.near=H-165; G.gaugeY=H-74;
  layoutScenery(); buildBg();
}
const depthK = y => clamp((y-HZ)/(H-HZ),0,1);
const sc = y => .5 + .5*depthK(y);
function spotAt(x,y){
  if (REG()==='coast') return coastSpot(x,y);
  const d=G.deep, dx=(x-d.x)/d.rx, dy=(y-d.y)/d.ry; if (dx*dx+dy*dy<1.25) return 'deep';
  for (const p of (G.padClusters||[G.pads])) if (Math.hypot(x-p.x,(y-p.y)*1.8) < p.r*1.15) return 'pads';
  if (y < lerp(G.near,HZ+26,.8)) return 'far';
  if (SC.bank && SC.bank.L.length) for (const pts of [SC.bank.L,SC.bank.R]) for (let i=0;i<pts.length-1;i++){
    const [ax,ay]=pts[i], [bx,by]=pts[i+1], vx=bx-ax, vy=by-ay, t=clamp(((x-ax)*vx+(y-ay)*vy)/(vx*vx+vy*vy),0,1);
    if (Math.hypot(x-(ax+vx*t),y-(ay+vy*t))<44) return 'reeds'; }
  return 'open';
}

/* ---------- State ---------- */
const S = {state:'idle', time:0, freeze:0, shake:0, pulse:0, pulseColor:'255,255,255', dark:0, darkT:0, zoom:1, zoomT:1, tilt:0, holding:false, thumbX:0,

function coach(text, step, warn){ const c=$('coach'); $('coachText').textContent=text; $('coachStep').textContent=step||'Tip'; c.classList.toggle('warn',!!warn); if (c.hidden){ c.hidden=false; } $('hint').hidden=true; }

let coachTimer=0;

function setState(s){ S.state=s; document.body.dataset.state=s; updateHint(); if (s==='idle' && save.meal && save.meal.last) mealEnd();

/* ---------- Effects ---------- */
function splash(x,y,n,col){ for (let i=0;i<n;i++){ const a=rand(-Math.PI*.95,-Math.PI*.05), v=rand(40,150)*sc(y);
  S.particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:380,life:0,max:rand(.35,.75),r:rand(1.2,2.8)*sc(y),c:col||'rgba(225,238,242,'}); } }
function confetti(x,y,n){ for (let i=0;i<n;i++){ const a=rand(0,Math.PI*2), v=rand(80,260);
  S.particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-80,g:160,life:0,max:rand(1.2,2.2),r:rand(2.5,4.5),c:'rgba(226,180,79,',spin:rand(-8,8),rect:true}); } }
function ripple(x,y,max){ S.ripples.push({x,y,r:2,max:max*sc(y),life:0}); }
function shake(m){ if (!REDUCED) S.shake=Math.max(S.shake,m); }
function pulse(a,col){ S.pulse=Math.max(S.pulse,a); S.pulseColor=col||'255,255,255'; }
let toastTimer=0;
function toast(text, kind=''){ const t=$('toast'); t.className=''; void t.offsetWidth; t.textContent=text; t.className='show '+kind; }
let lastHint='';
function setHint(t){ if (t!==lastHint){ lastHint=t; $('hint').textContent=t; } }
function updateHint(){
  const s=S.state;
  const vet=save.tutorialDone && save.stats.casts>=12; S.idleT=0;
  if (s==='idle') setHint(vet?'':save.firstCast ? 'Drag down from anywhere, then let go to cast.' : 'Drag back to aim. Release to cast.');

  else setHint('');
}

/* ---------- Casting ---------- */
function updateAim(x,y){
  const a=S.aim; a.x=x; a.y=y;
  const vx=a.sx-x, vy=a.sy-y, len=Math.hypot(vx,vy), maxPull=Math.min(H*.3,230);
  a.p = -vy>4 ? clamp(len/maxPull,0,1) : 0;
  a.th = len>10 ? clamp(Math.atan2(vx,-vy),-.8,.8) : 0;
  const depth=clamp((a.p-.12)/.88,0,1)*ROD().reach, ty=lerp(G.near,HZ+26,depth); a.depth=depth;
  const tx=clamp(W/2+Math.tan(a.th)*(G.player.y-ty)*.85,22,W-22);
  a.target={x:tx,y:ty}; a.spot=spotAt(tx,ty); a.lucky=inLucky(tx,ty);
}
function release(){
  const a=S.aim; S.aim=null;
  if (a && a.onNet && Math.hypot(a.x-a.sx,a.y-a.sy)<14){ setState('idle'); openNet(); return; }
  if (a && a.onBar && Math.hypot(a.x-a.sx,a.y-a.sy)<14){ setState('idle'); openBoatShop(); return; }
  if (a && a.onOtt && Math.hypot(a.x-a.sx,a.y-a.sy)<14){ setState('idle'); openShop(); return; }
  if (!a || !a.target || a.p<.12){ setState('idle'); if (S.tut) coach('Drag a little farther down before you let go.','1 of 4'); else toast('Pull back farther','warn'); return; }
  S.cast={t:0, dur:.4+.42*a.p, from:{x:G.rodBase.x+18,y:G.rodBase.y-88}, to:a.target, p:a.p, th:a.th, spot:a.spot};
  save.stats.casts++; sfx.cast(a.p); buzz(10); tickMeal();
  if (save.firstCast){ save.firstCast=false; persist(); }
  setState('casting');
}
function lurePos(){
  if (S.state==='casting'){ const c=S.cast, u=clamp((c.t-.1)/c.dur,0,1);
    return {x:lerp(c.from.x,c.to.x,u), y:lerp(c.from.y,c.to.y,u)-Math.sin(Math.PI*u)*(70+140*c.p), u}; }
  if (S.state==='reeling') return {x:S.reel.x, y:S.reel.y};
  if (S.state==='lost' && S.lost) return S.lost.pos;
  if (S.bob) return {x:S.bob.x, y:S.bob.y};
  return null;
}
function updateCast(dt){
  const c=S.cast; c.t+=dt;
  if (c.t-.1>=c.dur){
    const {x,y}=c.to;
    if (REG()==='coast' && !noWashout() && S.swell && S.swell.y!=null && Math.abs(S.swell.y-y)<34*sc(y)){
      splash(x,y,12); ripple(x,y,30); noise(.4,{vol:.18,f:800,to:300,type:'lowpass'}); buzz(20);
      toast('Washed out by the swell!','warn'); coachFor('Cast into the calm water between swells.',4);
      S.lost={t:0,pos:{x,y},snapped:false}; setState('lost'); return; }
    if (c.spot==='reeds' && !S.tut && Math.random()<ROD().snag){
      splash(x,y,6); ripple(x,y,18); sfx.snap(); buzz([0,30,30,30]); shake(2);
      toast('Snagged in the reeds!','warn'); coachFor('Reeds snag ordinary rods. Ottilie sells a Reedcutter that slices right through.',5);
      S.lost={t:0,pos:{x,y},snapped:false}; setState('lost'); return; }
    S.bob={x,y,spot:c.spot,dip:1,jerk:0,nibble:0,plunge:0};
    splash(x,y,8); ripple(x,y,40); ripple(x,y,24); sfx.plop(); buzz(8);
    for (const f of S.ambient){ if (Math.hypot(f.x*W-x,f.y*H-y)<90){ f.flee=1.2; f.a=Math.atan2(f.y*H-y,f.x*W-x); } }
    startWaiting();
  }
}

/* ---------- Waiting & bite ---------- */
function startWaiting(){
  S.wait={phase:'empty', t:rand(.75,2.1)*save.tune.wait*(S.bob.spot==='deep'?1.2:1), fish:null, sh:null, nib:0, nibT:0, tw:[], attract:1};
  setState('waiting');
  if (S.bob.spot==='reeds') S.wait.t/=ROD().reedBoost;
  if (S.tut){ S.tut='wait'; S.wait.t=.8; coach('Nice cast! Now wait. A fish will swim over to your bobber.','2 of 4'); }
}
function spawnApproach(){
  const w=S.wait, b=S.bob; w.lucky=inLucky(b.x,b.y); w.fish=S.tut?'perch':pickW(poolFor(b.spot,w.lucky)); const F=FISH[w.fish];
  const ang=rand(0,Math.PI*2), d=rand(85,150);
  const x=clamp(b.x+Math.cos(ang)*d,20,W-20), y=clamp(b.y+Math.sin(ang)*d*.5,HZ+18,H-150);
  w.sh={x,y,ang:Math.atan2(b.y-y,b.x-x),alpha:0,flee:false};
  if (sonarOn() && !S.tut){ setHint('Sonar: '+(F.rarity==='common'?'a common fish':'a '+RAR[F.rarity].label+' fish')+' is coming in.'); if (F.rarity!=='common') tone(1250,.09,{vol:.06,type:'sine'}); }
  w.phase='approach'; w.attract=1;
}
function updateWaiting(dt){
  const w=S.wait, b=S.bob;
  if (w.sh){ const sh=w.sh;
    if (sh.flee){ sh.x+=Math.cos(sh.ang)*170*dt; sh.y+=Math.sin(sh.ang)*85*dt; sh.alpha-=dt*1.6; if (sh.alpha<=0) w.sh=null; }
    else {
      sh.alpha=Math.min(1,sh.alpha+dt*.9);
      const F=FISH[w.fish];
      if (w.phase==='approach'){
        const dx=b.x-sh.x, dy=b.y-sh.y, d=Math.hypot(dx,dy);
        const sp=(20+F.len*.35)*w.attract*sc(sh.y)*(F.beh==='sleeper'?.5:1);
        sh.ang=angLerp(sh.ang, Math.atan2(dy,dx)+Math.sin(S.time*2.2)*.5*Math.min(1,d/70), dt*3);
        sh.x+=Math.cos(sh.ang)*sp*dt; sh.y+=Math.sin(sh.ang)*sp*dt*.6;
        if (d<10+F.len*.2*sc(sh.y)){ w.phase='nibble'; w.nib=S.tut?1:F.beh==='sleeper'?2+Math.floor(rand(0,3)):Math.floor(rand(0,(F.rarity==='rare'||F.rarity==='legendary')?4:3)); w.nibT=S.tut?1.2:rand(.5,1.1); }
      } else if (w.phase==='nibble'){
        sh.ang=angLerp(sh.ang,Math.atan2(b.y-sh.y,b.x-sh.x),dt*2);
        const hx=b.x-Math.cos(sh.ang)*F.len*.38*sc(b.y), hy=b.y-Math.sin(sh.ang)*F.len*.2*sc(b.y);
        sh.x=lerp(sh.x,hx,dt*3); sh.y=lerp(sh.y,hy,dt*3);
        w.nibT-=dt;
        if (w.nibT<=0){
          if (w.nib>0){ w.nib--; w.nibT=S.tut?2.2:FISH[w.fish].beh==='sleeper'?rand(1,1.8):rand(.55,1.4); b.nibble=1; ripple(b.x,b.y,14); sfx.nibble(); if (S.tut) coach('That little bob was just a nibble. Wait for the bobber to plunge under.','2 of 4'); }
          else triggerBite();
        }
      }
    }
  }
  if (w.phase==='empty'){ w.t-=dt; if (w.t<=0) spawnApproach(); }
}
function twitch(){
  const w=S.wait, b=S.bob; w.tw=w.tw.filter(t=>S.time-t<2.5); w.tw.push(S.time);
  b.jerk=1; ripple(b.x,b.y,18); sfx.twitch(); buzz(6);
  if (S.tut){ if (w.phase==='nibble') coach('Not yet! Wait until the bobber plunges all the way under.','2 of 4', true); else if (w.phase==='approach') w.attract=Math.min(2.3,w.attract+.45); return; }
  if (w.fish && w.phase!=='empty' && FISH[w.fish].beh==='sleeper'){ spook('Something sleepy swam off. Some fish hate twitching.'); return; }
  if (w.phase==='nibble'){ spook('Too early! Wait for the plunge.'); return; }
  if (w.tw.length>=4){ spook('Easy. Too much twitching spooks them.'); return; }
  const ash=save.rod==='ash';
  if (w.phase==='empty') w.t=Math.max(.3,w.t*(ash?.45:.65));
  else if (w.phase==='approach') w.attract=Math.min(ash?3:2.3,w.attract+(ash?.9:.45));
}
function spook(msg){
  const w=S.wait; if (w.sh){ w.sh.flee=true; w.sh.ang+=Math.PI; }
  w.phase='empty'; w.t=rand(1.65,2.7)*save.tune.wait; w.attract=1; w.tw=[]; toast(msg,'warn');
}
function triggerBite(){
  const w=S.wait, b=S.bob, F=FISH[w.fish];
  S.bite={t:0, win:F.window*save.tune.hook*mealMul('hook'), fish:w.fish};
  b.plunge=1; splash(b.x,b.y,9); ripple(b.x,b.y,34); sfx.bite(); buzz(30); pulse(.45);
  toast('Tap!','big'); setState('bite');
  if (S.tut){ S.tut='bite'; coach('It’s biting! Tap anywhere on the screen now!','3 of 4', true); }
}
function updateBite(dt){
  const b=S.bite; b.t+=dt; S.bob.plunge=Math.max(.6,S.bob.plunge-dt);
  if (b.t>b.win){
    if (S.tut){ S.bob.plunge=0; const w=S.wait; w.phase='nibble'; w.nib=0; w.nibT=1.6; S.tut='wait'; setState('waiting');
      coach('Too slow, but it’s still hungry. Tap the moment the bobber plunges.','2 of 4', true); return; }
    rec(b.fish).seen=true; lose('Too slow. It got away.'); }
}
function hook(){
  const b=S.bite, F=FISH[b.fish], R=RAR[F.rarity];
  const perfect=b.t<=.3*save.tune.hook*(save.rod==='brasscap'?1.5:1)*mealMul('perfect');
  if (perfect){ save.stats.perfect++; toast('Perfect hook!','good'); } else toast('Hooked!','');
  sfx.hook(perfect); buzz(perfect?[0,20,30,20]:25);
  S.freeze=R.hitstop+(perfect?.04:0); shake(F.rarity==='legendary'?10:F.rarity==='rare'?5:2); pulse(perfect?.35:.2);
  splash(S.bob.x,S.bob.y,8+R.splash/3);
  if (F.rarity==='legendary'){ S.darkT=.5; setTimeout(()=>toast('Something enormous…','gold'),350); }
  else if (F.rarity==='rare') S.darkT=.18;
  startReel(b.fish,perfect);
}

/* ---------- Reeling ---------- */
function startReel(id,perfect){
  const F=FISH[id], fam=rec(id).caught>=10, first=rec(id).caught===0;
  S.reel={lucky:!!(S.wait&&S.wait.lucky),id,F,perfect,fam,dist:1,dir:0,tgt:0,dirT:S.tut?99:rand(1.2,1.8),tension:perfect?.1:.2,slack:0,slackWarned:false,strain:0,onIt:0,
    from:{x:S.bob.x,y:S.bob.y},x:S.bob.x,y:S.bob.y,jump:null,nextJump:rand(2,3),dive:0,warn:0,nextDive:rand(2.4,3.4),surge:0,
    click:0,splashT:0,buzzT:0};
  S.holding=S.pointers.size>0; S.tilt=0; S.pressX=S.thumbX; S.pressTilt=0; humStart(); setState('reeling');
  if (S.tut){ S.tut='reel1'; coach('Hooked! Now press and hold your finger down to reel it in.','4 of 4'); }
  else if (first && F.beh==='leaper') coachShow('New fish: Leapers jump out of the water. Tap while it’s in the air to keep the line tight.',6);
  else if (first && F.beh==='tugger') coachShow('New fish: Tuggers pull in a steady rhythm. Let go on each tug, and reel in between.',6);
  else if (first && F.beh==='sleeper') coachShow('New fish: Sleepers barely fight. The hard part was the patience before the bite.',6);
  else if (first && F.beh==='sulker') coachShow('New fish: Sulkers dive. When it dives, let go, then reel hard when it comes back up.',6);
  else if (first && F.rarity==='legendary') coachShow('Something huge. Reel in short bursts and let go whenever the ring turns red.',6);
}
function updateReel(dt){
  const R=S.reel, F=R.F, tm=save.tune.tension/(ROD().line*mealMul('line')), tut=S.tut;
  const quick=F.rarity==='legendary', calm=F.rarity==='common';
  if (tut==='reel1'||tut==='reel2'){ /* direction is scripted by the tutorial */ }
  else if (F.beh==='darter'){
    R.dirT-=dt;
    if (R.dirT<=0){ R.tgt=(R.tgt>0?-1:1)*rand(.5,.9); R.dirT=tut?3:quick?rand(.9,1.4):calm?rand(1.8,2.7):rand(1.3,2); splash(R.x,R.y,5); }
  } else if (F.beh==='sulker'){ R.tgt=Math.sin(S.time*.5+1)*.5; }

  else { R.dirT-=dt; if (R.dirT<=0){ R.tgt=rand(-.8,.8); R.dirT=rand(1.4,2.2); } }
  R.dir=lerp(R.dir,R.tgt,Math.min(1,dt*(quick?3:1.7)));

  if (R.fam) S.tilt=lerp(S.tilt,R.dir,Math.min(1,dt*8));
  else if (S.holding){ const want=clamp(S.pressTilt+(S.thumbX-S.pressX)/(W*.65),-1,1); S.tilt=lerp(S.tilt,want,Math.min(1,dt*14)); }
  const gap=Math.abs(S.tilt-R.dir), m=clamp((gap-.32)/.9,0,1);
  R.onIt=m===0?R.onIt+dt:0;

  if (S.tut==='reel2' && R.onIt>.6 && Math.abs(R.dir-R.tgt)<.1){ S.tut='reel3'; R.dirT=2.6;

    else { R.nextDive-=dt; if (R.nextDive<=0){ R.warn=.6; R.nextDive=rand(2.6,4.2); toast('It’s diving. Let go!','warn'); } }

      if (R.jump.t>=R.jump.dur){ const j=R.jump; R.jump=null; splash(R.x,R.y,14); ripple(R.x,R.y,30);
        if (!j.tapped){ R.tension=.02; R.dist=Math.min(1,R.dist+.12); toast('Slack! Tap while it jumps.','warn');

    } else { R.nextJump-=dt; if (R.nextJump<=0){ R.jump={t:0,dur:.8,tapped:false}; R.nextJump=rand(2.2,3.6); splash(R.x,R.y,10); sfx.leap(); } }
  }

  else if (!reeling && tug){ R.dist=Math.min(1,R.dist+.03*dt); }
  if (tug){ if (!reeling) R.tension=Math.max(0,R.tension-.6*dt); }
  else if (reeling){

    else {

      const spd=(1/F.reel)*ROD().reel*(1-.6*m)*(R.surge>0?2:1)*(F.beh==='tugger'?1.4:1)*(R.fam?1.65:1)*(R.perfect?1.1:1)*mealMul('reel');

  const k=1-R.dist, by=lerp(R.from.y,Math.min(G.near+22,H-140),k), bx=lerp(R.from.x,W/2,k);

}

function coastSpot(x,y){
  const d=G.deep, dx=(x-d.x)/d.rx, dy=(y-d.y)/d.ry; if (dx*dx+dy*dy<1.25) return 'deep';

function tankOf(id){ return REGION_FISH.coast.includes(id)?'salt':'fresh'; }

function hasDecor(k,id){ return tanks()[k].decor.includes(id); }

function jarHours(k){ return decorFor(k).some(d=>d.jar)?12:6; }
function jarCap(k){ return Math.max(20,tipRate(k)*60*jarHours(k)); }
function accrueTips(){ const now=Date.now(), T=tanks();
  for (const k in T){ const t=T[k], mins=Math.max(0,(now-t.tipT)/60000); t.tipT=now; if (!t.owned) continue; t.tips=Math.min(jarCap(k),t.tips+tipRate(k)*mins); }
  const total=Object.values(T).reduce((a,t)=>a+t.tips,0), b=$('aquaTips'); if (b){ b.hidden=total<5; b.textContent=Math.floor(total); } }
function setsDone(){ const t=tanks(); return TANK_SETS.filter(s=>t[s.tank].owned && s.check(t[s.tank].fish)); }
function setLuck(){ const r=REG(), n=isNight(save.clock); let l=setsDone().reduce((a,s)=>a*((s.luck && (s.region==='any'||s.region===r) && (!s.night||n))?s.luck:1),1);
  for (const k in TANKS) for (const d of decorFor(k)) if (d.luck && d.luck.region===r && tanks()[k].fish.some(f=>d.ids&&d.ids.includes(f.id))) l*=d.luck.v; return l; }

function addToTank(f){ accrueTips(); const k=tankOf(f.id), before=new Set(setsDone().map(s=>s.id)); tanks()[k].fish.push(f); persist();
  setsDone().forEach(s=>{ if (!before.has(s.id)) setTimeout(()=>{ toast('Tank set: '+s.name,'gold'); coachFor('Tank set complete: '+s.name+'. '+s.bonus+'.',6); sfx.out('rare'); },400); });

function pickNet(R){ // cheapest matching fish from the keepnet, without removing them
  const picks=[], taken=new Set();
  for (const n of R.need){
    const pool=save.net.map((f,i)=>({f,i})).filter(o=>!taken.has(o.i) && (n.id?o.f.id===n.id:FISH[o.f.id].rarity===n.rar)).sort((a,b)=>(isPB(a.f)-isPB(b.f))||(a.f.value-b.f.value));

function news(text,kind){ if (NEWS.q.length && NEWS.q[NEWS.q.length-1].text===text) return; NEWS.q.push({text,kind:kind||''}); if (NEWS.q.length>4) NEWS.q.shift(); if (!NEWS.busy) newsNext(); }
function newsNext(){ const el=$('news'); const n=NEWS.q.shift(); if (!n){ NEWS.busy=false; return; } NEWS.busy=true;
  const c=$('coach'); el.style.top=(!c.hidden && !document.body.classList.contains('cine'))?(c.getBoundingClientRect().bottom+8)+'px':'';
  el.className='show '+n.kind; el.textContent=n.text; clearTimeout(NEWS.tm); NEWS.tm=setTimeout(()=>{ el.className='hide '+n.kind; setTimeout(newsNext,260); },2400+Math.min(1600,n.text.length*25)); }

const COACHQ=[];
function coachLater(text,secs){ if (coachTimer || S.tut){ if (!COACHQ.some(c=>c.text===text)) COACHQ.push({text,secs,at:performance.now()}); return; } coachShow(text,secs); }
function coachShow(text,secs){ coach(text,'Tip'); clearTimeout(coachTimer); coachTimer=setTimeout(()=>{ coachTimer=0; if (!S.tut) coachOff(); setTimeout(coachDrain,700); },secs*1000); }
function coachDrain(){ if (coachTimer || S.tut) return; while (COACHQ.length && performance.now()-COACHQ[0].at>90000) COACHQ.shift(); const n=COACHQ.shift(); if (n) coachShow(n.text,n.secs); }

function fnv36(s){ let h=2166136261; for (let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return (h>>>0).toString(36); }
function b64uEnc(u8){ let s=''; for (let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64uDec(str){ str=str.replace(/-/g,'+').replace(/_/g,'/'); while (str.length%4) str+='='; const s=atob(str), u=new Uint8Array(s.length); for (let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; }
async function zip(u8,inflate){ const S2=inflate?DecompressionStream:CompressionStream; const st=new S2('deflate'), w=st.writable.getWriter(); w.write(u8); w.close(); return new Uint8Array(await new Response(st.readable).arrayBuffer()); }
async function makeCode(){ const json=JSON.stringify({v:BUILD,t:Date.now(),save}); let bytes=new TextEncoder().encode(json), z=false;
  if (window.CompressionStream){ try { bytes=await zip(bytes,false); z=true; } catch(e){} }
  const body=b64uEnc(bytes); return 'HM1'+(z?'z':'j')+'.'+body+'.'+fnv36(body); }
async function readCode(raw){ const s=String(raw||'').replace(/\s+/g,'');
  if (!s) throw new Error('Paste a backup code first.');
  let obj;
  if (s[0]==='{'){ obj=JSON.parse(s); }
  else { const m=s.match(/^HM1([zj])\.([A-Za-z0-9_-]+)\.([0-9a-z]+)$/); if (!m) throw new Error('That doesn’t look like a Hollowmere backup code. It should start with HM1.');
    if (fnv36(m[2])!==m[3]) throw new Error('This code is incomplete or has a typo. Copy the whole thing and try again.');
    let bytes=b64uDec(m[2]); if (m[1]==='z'){ if (!window.DecompressionStream) throw new Error('This browser is too old to read compressed codes.'); bytes=await zip(bytes,true); }
    obj=JSON.parse(new TextDecoder().decode(bytes)); }
  const sv=obj&&obj.save?obj.save:obj; if (!sv || typeof sv.coins!=='number' || typeof sv.fish!=='object') throw new Error('This code doesn’t hold a Hollowmere save.');
  return {t:obj.t||null,v:obj.v||0,save:sv}; }

function snapshots(){ try { return JSON.parse(localStorage.getItem(SNAP_KEY)||'[]'); } catch(e){ return []; } }
function snapshot(reason,force){ try { const list=snapshots(), last=list[list.length-1], now=Date.now();
    if (!force && last && now-last.t<9*60000) return; if (!save.tutorialDone && !force) return;
    list.push({t:now,reason,data:JSON.stringify(save)}); while (list.length>3) list.shift(); localStorage.setItem(SNAP_KEY,JSON.stringify(list)); } catch(e){} }

/* ---------- Loop ---------- */
let last=performance.now();
function update(dt,rdt){
  if (S.state==='idle' && save.tutorialDone && save.stats.casts>=12){ S.idleT=(S.idleT||0)+rdt; if (S.idleT>30 && S.idleT-rdt<=30) setHint('Drag back to aim. Release to cast.'); }
  updateAmbient(rdt); updateScenery(rdt); updateSwell(dt); updateBarnaby(rdt); updateMail(rdt);
  save.clock=(save.clock+rdt/60)%24; PAL=palAt(save.clock);
  { let d=Math.abs(save.clock-SC.bgHour); d=Math.min(d,24-d); if (d>.2) buildBg(); }
  const ct=(isNight(save.clock)||PERIOD(save.clock)==='Evening'?'\u263E\uFE0E ':'\u2600\uFE0E ')+clockText(save.clock); if (ct!==S.clockShown){ S.clockShown=ct; $('clock').textContent=ct; }
  for (const p of S.particles){ p.life+=dt; p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; }
  S.particles=S.particles.filter(p=>p.life<p.max); if (S.particles.length>260) S.particles.splice(0,S.particles.length-260);
  for (const r of S.ripples){ r.life+=dt*1.4; r.r=lerp(2,r.max,1-Math.pow(1-Math.min(1,r.life),2)); }
  S.ripples=S.ripples.filter(r=>r.life<1);
  S.shake=Math.max(0,S.shake-rdt*28); S.pulse=Math.max(0,S.pulse-rdt*1.8);
  S.dark=lerp(S.dark,S.darkT,Math.min(1,rdt*3)); S.zoom=lerp(S.zoom,S.zoomT,Math.min(1,rdt*2.5));
  switch(S.state){
    case 'casting': updateCast(dt); break;
    case 'waiting': updateWaiting(dt); break;
    case 'bite': updateBite(dt); break;
    case 'reeling': updateReel(dt); break;
    case 'landing': updateLand(dt); break;
    case 'lost': updateLost(dt); break;
  }
}
function frame(now){
  const dt=clamp((now-last)/1000,0,.05); last=now; S.time+=dt; musicFrame(dt);
  if (AQ.open||K.open){ update(dt,dt); requestAnimationFrame(frame); return; } // the world keeps turning while you're in a room
  let gdt=dt*(S.tut==='bite'?.35:1); if (S.freeze>0){ S.freeze-=dt; gdt=0; }
  S.tipT=(S.tipT||0)-dt; if (S.tipT<=0){ S.tipT=5; accrueTips(); }
  APP.snapT-=dt; if (APP.snapT<=0){ APP.snapT=600; snapshot('Autosave'); }
  update(gdt,dt); render(); requestAnimationFrame(frame);
}

cv.addEventListener('pointerdown',e=>{
  e.preventDefault(); audioInit(); S.pointers.add(e.pointerId); try { cv.setPointerCapture(e.pointerId); } catch(_){}
  const x=e.clientX, y=e.clientY; S.thumbX=x;
  switch(S.state){
    case 'idle': S.aim={sx:x,sy:y,x,y,p:0,th:0,target:null,spot:'open',onOtt:onOttilie(x,y),onBar:onBarnaby(x,y),onNet:onKeepnet(x,y)}; setState('aiming'); break;
    case 'waiting': twitch(); break;
    case 'bite': hook(); break;
    case 'reeling': leapTap(); S.holding=true; S.pressX=x; S.pressTilt=S.tilt; break;
    case 'result': if (S.time-S.cardAt>.5) dismissCard(S.cardDefault); break;
  }
});
cv.addEventListener('pointermove',e=>{
  if (!S.pointers.has(e.pointerId)) return; S.thumbX=e.clientX;
  if (S.state==='aiming' && S.aim) updateAim(e.clientX,e.clientY);
});
function up(e){
  S.pointers.delete(e.pointerId);
  if (S.state==='aiming') release();
  if (S.state==='reeling') S.holding=S.pointers.size>0;
}
cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{ last=performance.now(); if (document.hidden){ S.holding=false; S.pointers.clear(); if (AC && AC.state==='running') AC.suspend().catch(()=>{}); } else if (AC && AC.state==='suspended' && MU.on) AC.resume().catch(()=>{}); });
window.addEventListener('resize',()=>{ resize(); if (INTRO.active){ introLayout(); if (INTRO.full && INTRO.phase==='gate') setIntroOffset(H); } });
