/* ---------- Journal: species pages and personal records ---------- */
let JTAB='species';
function recWhere(pb){ if (!pb) return ''; if (!pb.t) return 'Caught before the tape measure, at '+(REGION_NAME[pb.reg]||'the lake');
  return spotLabel(pb.reg,pb.spot)+' · '+whenLabel(pb.t,pb.hr)+(pb.rod&&RODS[pb.rod]?' · '+RODS[pb.rod].name:''); }
function recBar(id,len){ const F=FISH[id], k=sizePct(id,len);
  return '<div class="rbar"><b style="width:'+Math.round(k*100)+'%"></b><i style="left:'+Math.round(k*100)+'%"></i></div><div class="rlab"><span>'+fmtLen(F.size[0])+'</span><span>'+(k>=.95?'Top of the range':'Range')+'</span><span>'+fmtLen(F.size[1])+'</span></div>'; }
function drawPlaque(x,id,w,h){ const F=FISH[id], pw=Math.min(w*.86,330), ph=h*.94;
  x.save(); x.fillStyle='rgba(40,25,10,.25)'; rrect(x,-pw/2+4,-ph/2+6,pw,ph,ph*.32); x.fill();
  const g=x.createLinearGradient(0,-ph/2,0,ph/2); g.addColorStop(0,'#8A5C3C'); g.addColorStop(1,'#5E3E2A'); rrect(x,-pw/2,-ph/2,pw,ph,ph*.32); x.fillStyle=g; x.fill(); x.strokeStyle=INK; x.lineWidth=2; x.stroke();
  x.save(); x.clip(); x.strokeStyle='rgba(30,15,5,.22)'; x.lineWidth=1.2; for (let i=0;i<7;i++){ x.beginPath(); for (let px=-pw/2;px<=pw/2;px+=6){ const y=-ph/2+8+i*ph/7+Math.sin(px*.04+i*1.3)*3; px===-pw/2?x.moveTo(px,y):x.lineTo(px,y); } x.stroke(); } x.restore();
  rrect(x,-pw/2+6,-ph/2+6,pw-12,ph-12,ph*.28); x.strokeStyle='rgba(255,230,190,.25)'; x.lineWidth=1.5; x.stroke();
  for (const sx of [-1,1]){ x.beginPath(); x.arc(sx*(pw/2-ph*.2),0,3.2,0,6.28); x.fillStyle=BRASS; x.fill(); x.strokeStyle=INK; x.lineWidth=1; x.stroke(); }
  const L=Math.min(pw*.68,(ph*.78)/(F.h*(id==='mayor'?2.9:2.45))); x.translate(0,ph*.04); x.rotate(-.07);
  x.save(); x.translate(4,5); drawFish(x,id,L,true,.55); x.restore(); drawFish(x,id,L,false,1,.15); x.restore(); }
function journalRegions(){ return save.boat?[REG(),REG()==='lake'?'coast':'lake']:['lake']; }
function openJournal(tab){ if (tab) JTAB=tab; const regs=journalRegions();
  let h='<div class="panel-head"><div><h2>Journal</h2><p>'+regs.map(r=>REGION_NAME[r]+' '+REGION_FISH[r].filter(id=>(save.fish[id]||{}).caught>0).length+'/'+REGION_FISH[r].length).join(' · ')+'</p></div><div class="spacer"></div><button class="btn" id="closeS" type="button">Close</button></div>'+
    '<div class="seg" role="tablist"><button type="button" role="tab" data-jt="species" class="'+(JTAB==='species'?'on':'')+'">Species</button><button type="button" role="tab" data-jt="records" class="'+(JTAB==='records'?'on':'')+'">Records</button></div>';
  h+=JTAB==='records'?recordsHTML(regs):speciesHTML(regs);
  openSheet(h); $('closeS').addEventListener('click',closeSheet);
  document.querySelectorAll('#panel [data-jt]').forEach(b=>b.addEventListener('click',()=>{ tone(900,.04,{vol:.04,type:'triangle'}); openJournal(b.dataset.jt); $('panel').scrollTop=0; }));
  document.querySelectorAll('#panel [data-units]').forEach(b=>b.addEventListener('click',()=>{ save.units=b.dataset.units; persist(); openJournal('records'); }));
  document.querySelectorAll('#panel canvas[data-f]').forEach(c=>{ const r=c.getBoundingClientRect(), d=Math.min(window.devicePixelRatio||1,2);
    c.width=r.width*d; c.height=r.height*d; const x=c.getContext('2d'); x.setTransform(d,0,0,d,r.width/2*d,r.height/2*d);
    const id=c.dataset.f, big=!!c.dataset.big, L=big?Math.min(r.width*.62,220):r.width*.8;
    if (c.dataset.sil){ x.fillStyle='rgba(43,42,51,.75)'; x.fill(tailPath(id,L)); x.fill(fishPath(id,L)); }
    else if (big) drawPlaque(x,id,r.width,r.height); else drawFish(x,id,L,false); });
}
function speciesHTML(regs){ let h='<div class="entries">';
  regs.forEach(rg=>{ h+='<h3 class="j-reg">'+REGION_NAME[rg]+'</h3>'; REGION_FISH[rg].forEach(id=>{ const F=FISH[id], r=save.fish[id]||{caught:0,best:0,seen:false};
    if (r.caught>0){ const m=Math.min(10,r.caught), pb=r.pb;
      h+='<div class="entry"><canvas data-f="'+id+'"></canvas><div><span class="r" style="color:'+RAR[F.rarity].color+'">'+RAR[F.rarity].label+' · '+BEH[F.beh]+'</span><h3>'+F.name+'</h3><p>Caught '+r.caught+(pb?' · Record <b>'+fmtW(pb.w)+'</b> · '+fmtLen(pb.size)+' '+starsHTML(pb.stars):'')+'</p><p>'+F.lore+'</p><div class="mast"><i style="width:'+m*10+'%"></i></div><p>'+(r.caught>=10?'Mastered: shorter reels, auto-tilt':'Mastery '+m+'/10')+'</p></div></div>'; }
    else h+='<div class="entry"><canvas data-f="'+id+'" data-sil="1"></canvas><div><span class="r" style="color:#7A7468">'+(r.seen?'Seen, not caught':'Undiscovered')+'</span><h3>???</h3><p>'+(r.seen?F.hint:'Keep fishing to find this one.')+'</p></div></div>';
  }); });
  return h+'</div>'; }
function recordsHTML(regs){ const s=save.stats, all=regs.flatMap(rg=>REGION_FISH[rg]).filter(id=>(save.fish[id]||{}).pb);
  const best=list=>list.reduce((b,id)=>!b||save.fish[id].pb.w>save.fish[b].pb.w?id:b,null);
  let h='<div class="seg units" aria-label="Units"><button type="button" data-units="imperial" class="'+(imperial()?'on':'')+'">lb · in</button><button type="button" data-units="metric" class="'+(!imperial()?'on':'')+'">kg · cm</button></div>';
  h+='<div class="stats"><div><b>'+fmtTotal(s.landed||0)+'</b><span>Fish landed</span></div><div><b>'+(s.pbs||0)+'</b><span>Records broken</span></div><div><b>'+(s.trophies||0)+'</b><span>3-star catches</span></div></div>';
  const top=best(all);
  if (!top) return h+'<p class="note">Your biggest fish will be recorded here, measured and weighed on the spot.</p>';
  const T=save.fish[top].pb, TF=FISH[top];
  h+='<div class="rec-hero"><span class="k">Biggest catch</span><canvas data-f="'+top+'" data-big="1"></canvas><h3>'+TF.name+'</h3><p class="hw">'+fmtW(T.w)+'</p><p class="hl">'+fmtLen(T.size)+' '+starsHTML(T.stars)+'</p><p class="where">'+recWhere(T)+'</p></div>';
  regs.forEach(rg=>{ const ids=REGION_FISH[rg], got=ids.filter(id=>(save.fish[id]||{}).pb), b=best(got);
    h+='<h3 class="j-reg">'+REGION_NAME[rg]+(b?'<span>Biggest here: '+FISH[b].name+', '+fmtW(save.fish[b].pb.w)+'</span>':'')+'</h3><div class="entries">';
    ids.slice().sort((a,c2)=>(((save.fish[c2]||{}).pb||{}).w||-1)-(((save.fish[a]||{}).pb||{}).w||-1)).forEach(id=>{ const F=FISH[id], r=save.fish[id]||{}, pb=r.pb;
      if (!pb){ h+='<div class="rec-row none"><canvas data-f="'+id+'" data-sil="1"></canvas><div><h4>'+(r.caught||r.seen?F.name:'???')+'</h4><p>No record yet.</p></div></div>'; return; }
      h+='<div class="rec-row'+(id===b?' top':'')+'"><canvas data-f="'+id+'"></canvas><div><h4>'+F.name+' '+starsHTML(pb.stars)+'</h4><p class="rw"><b>'+fmtW(pb.w)+'</b> · '+fmtLen(pb.size)+'</p>'+recBar(id,pb.size)+'<p class="where">'+recWhere(pb)+'</p></div></div>'; });
    h+='</div>'; });
  return h+'<p class="note" style="margin-top:12px">A record is your heaviest of each species. Weight follows length, give or take how well-fed the fish was.</p>'; }

/* ---------- Keepnet and Ottilie's shop sheets ---------- */
function openNet(){
  audioInit(); const n=save.net.length, cap=netCap();
  const total=save.net.reduce((a,f)=>a+f.value,0), commons=save.net.filter(f=>FISH[f.id].rarity==='common');
  let h='<div class="panel-head"><div><h2>Keepnet</h2><p>'+n+' of '+cap+' fish · worth <b>'+total.toLocaleString()+'</b> coins</p></div><div class="spacer"></div><button class="btn" id="closeS" type="button">Close</button></div>';
  if (!n) h+='<p class="note">Empty for now. Tap Keep on a catch card and the fish lands here.</p>';
  else {
    h+='<div class="row" style="margin-bottom:12px"><button class="btn" id="sellCommons" type="button"'+(commons.length?'':' disabled')+'>Sell commons · +'+commons.reduce((a,f)=>a+f.value,0)+'</button><button class="btn" id="sellAll" type="button">Sell all · +'+total.toLocaleString()+'</button></div>';
    h+='<div class="entries">';
    save.net.map((f,i)=>({f,i})).sort((a,b)=>b.f.value-a.f.value).forEach(({f,i})=>{ const F=FISH[f.id];
      const tags=[f.perfect?'Perfect hook':'',f.lucky?'Gull luck':''].filter(Boolean).join(' · ');
      h+='<div class="entry" style="grid-template-columns:84px 1fr auto"><canvas data-f="'+f.id+'" style="width:84px;height:42px"></canvas><div style="min-width:0"><span class="r" style="color:'+RAR[F.rarity].color+'">'+RAR[F.rarity].label+'</span><h3>'+F.name+(isPB(f)?'<span class="net-rec">Record</span>':'')+'</h3><p>'+fmtW(fishW(f))+' · '+fmtLen(f.size)+' '+starsHTML(fishQ(f))+(tags?'<br>'+tags:'')+'</p></div>'+
        '<div style="display:grid;gap:6px"><button class="btn" data-tank="'+i+'" type="button"'+(tankRoom(f.id)?'':' disabled')+'>'+(tankRoom(f.id)?'To tank':tanks()[tankOf(f.id)].owned?'Tank full':'No tank')+'</button><button class="btn" data-sell="'+i+'" type="button">Sell · +'+f.value+'</button></div></div>'; });
    h+='</div>';
  }
  h+='<p class="note" style="margin-top:12px">Fish stay fresh in the net, so there’s no rush to sell.'+(hasPart('hold')?'':' A Roomy Keepnet from Tacklegram holds 24.')+'</p>';
  openSheet(h); $('closeS').addEventListener('click',closeSheet);
  document.querySelectorAll('#panel canvas[data-f]').forEach(c=>{ const r=c.getBoundingClientRect(), d=Math.min(window.devicePixelRatio||1,2);
    c.width=r.width*d; c.height=r.height*d; const x=c.getContext('2d'); x.setTransform(d,0,0,d,r.width/2*d,r.height/2*d); drawFish(x,c.dataset.f,r.width*.8,false); });
  const sell=idxs=>{ const set=new Set(idxs); let sum=0; save.net=save.net.filter((f,i)=>{ if (set.has(i)){ sum+=f.value; return false; } return true; }); persist(); if (sum) addCoins(sum); openNet(); };
  document.querySelectorAll('[data-sell]').forEach(b=>b.addEventListener('click',()=>sell([+b.dataset.sell])));
  document.querySelectorAll('#panel [data-tank]').forEach(b=>b.addEventListener('click',()=>{ const i=+b.dataset.tank, f=save.net[i]; if (!f || !tankRoom(f.id)) return; save.net.splice(i,1); addToTank(f); persist(); sfx.plop(); news(FISH[f.id].name+' is in the aquarium','good'); openNet(); }));
  const sc=$('sellCommons'); if (sc) sc.addEventListener('click',()=>sell(save.net.map((f,i)=>FISH[f.id].rarity==='common'?i:-1).filter(i=>i>=0)));
  const sa=$('sellAll'); if (sa){ let armed=false; sa.addEventListener('click',()=>{ const rare=save.net.some(f=>FISH[f.id].rarity!=='common');
    if (rare && !armed){ armed=true; sa.textContent='Includes rare fish · tap again'; return; } sell(save.net.map((f,i)=>i)); }); }
}
function openShop(){
  audioInit();
  const first=!save.metOttilie; save.metOttilie=true; persist();
  const cur=ROD(), nextId=ROD_ORDER.find(id=>!save.rods.includes(id));
  const greet=first?'So you’re the new keeper. That Willow barely reaches past the dock. Earn some coins and I’ll set you up with something better.'
    : nextId && save.coins>=RODS[nextId].price ? 'Now you’ve got coin. The '+RODS[nextId].name+' will take you farther out.'
    : nextId ? 'Rods aren’t free, kid. Bring me coins and I’ll get you further out on that water.'
    : 'You’ve got the best rod I make. Go catch something worth bragging about.';
  const bar=(label,v,max,cv)=>'<div style="display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:center;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#7A7468">'+label+
    '<div style="position:relative;height:7px;background:rgba(43,42,51,.12);border-radius:4px"><i style="position:absolute;inset:0 auto 0 0;width:'+Math.round(v/max*100)+'%;background:'+(v>cv?'#5E9B4E':v<cv?'#C0705C':'#8A8578')+';border-radius:4px"></i>'+
    '<i style="position:absolute;top:-3px;bottom:-3px;left:calc('+Math.round(cv/max*100)+'% - 1px);width:2px;background:#2B2A33"></i></div></div>';
  let h='<div class="panel-head"><div><h2>Ottilie’s Rods</h2><p>You have <b>'+save.coins.toLocaleString()+'</b> coins · Equipped: '+cur.name+'</p></div><div class="spacer"></div><button class="btn" id="closeS" type="button">Close</button></div>';
  h+='<p class="note" style="font-style:italic;font-size:14px;color:#4B4842">“'+greet+'”</p><p class="note" style="margin-top:-6px">Dark line on each bar = your equipped rod.</p><div class="entries">';
  ROD_ORDER.forEach(id=>{ const R=RODS[id], owned=save.rods.includes(id), eq=save.rod===id, can=save.coins>=R.price, isNext=id===nextId;
    const btn=eq?'<span class="r" style="color:#4E7B4C">Equipped</span>':owned?'<button class="btn" data-eq="'+id+'" type="button">Equip</button>'
      :'<button class="btn" data-buy="'+id+'" type="button"'+(can?'':' disabled style="opacity:.45"')+'>Buy · '+R.price.toLocaleString()+'</button>';
    h+='<div class="entry" style="grid-template-columns:1fr auto;'+(isNext?'border-color:#C9A15A;border-width:2px':'')+'"><div style="display:grid;gap:5px;min-width:0">'+
      (isNext?'<span class="r" style="color:#A07A2E">Next upgrade</span>':'')+'<h3>'+R.name+'</h3><p style="margin:0">Reaches: <b>'+R.where+'</b></p>'+
      bar('Reach',R.reach,1,cur.reach)+bar('Line',R.line,maxStat('line'),cur.line)+bar('Reel',R.reel,maxStat('reel'),cur.reel)+bar('Luck',R.luck,maxStat('luck'),cur.luck)+bar('Value',R.value,maxStat('value'),cur.value)+
      '<p style="margin:2px 0 0;font-weight:700;color:'+(id==='willow'?'#7A7468':'#3D5A3A')+'">'+(id==='willow'?'':'Perk: ')+R.perk+'</p></div><div>'+btn+'</div></div>'; });
  openSheet(h+'</div>');
  $('closeS').addEventListener('click',closeSheet);
  document.querySelectorAll('[data-eq]').forEach(b=>b.addEventListener('click',()=>{ save.rod=b.dataset.eq; persist(); sfx.hook(false); news('Equipped '+RODS[save.rod].name,'good'); openShop(); }));
  document.querySelectorAll('[data-buy]').forEach(b=>b.addEventListener('click',()=>{ const id=b.dataset.buy, R=RODS[id]; if (save.coins<R.price) return;
    addCoins(-R.price); save.rods.push(id); save.rod=id; persist(); sfx.out('uncommon'); buzz([0,30,40,30]); toast('New rod: '+R.name+'!','gold'); openShop(); }));
}

  $('hideLab').addEventListener('click',()=>{ save.hideLab=true; persist(); closeSheet(); updateHud(); news('Long-press the clock to open Playtest',''); });
  $('stockBtn').addEventListener('click',()=>{ const ids=['perch','perch','perch','reedwhisker','lantern','leafjack','mossback','mayor'].concat(save.boat?['bream','grouper']:[]), now=Date.now();
    for (const id of ids){ if (save.net.length>=netCap()) break; const F=FISH[id]; rec(id).seen=true; if (!rec(id).caught){ rec(id).caught=1; rec(id).best=F.size[0]; } const sz=Math.round(lerp(F.size[0],F.size[1],Math.random()*.8)*10)/10, wg=Math.round(weighFish(id,sz,rollBuild())); save.net.push({id,size:sz,w:wg,stars:qualityOf(id,sz,false),value:F.value,t:now,reg:REGION_FISH.coast.includes(id)?'coast':'lake',spot:'open',hr:save.clock,rod:save.rod}); }
    if (!save.kitchenOpen){ save.tutorialDone=true; save.stats.catches=Math.max(5,save.stats.catches); } persist(); closeSheet(); updateHud(); kitchenUnlockCheck(); news('Keepnet stocked','good'); });
  $('replayTut').addEventListener('click',()=>{ save.tutorialDone=false; persist(); closeSheet(); setState('idle'); });
  $('resetT').addEventListener('click',()=>{ save.tune={hook:1,tension:1,wait:1}; persist(); closeSheet(); $('labBtn').click(); });
  let armed=false; $('resetAll').addEventListener('click',e=>{ if (!armed){ armed=true; e.target.textContent='Tap again to erase'; return; }
    snapshot('Before erasing',true); const snd=save.sound; save=fresh(); save.sound=snd; persist(); coinShown=0; $('coins').textContent='0'; updateHud(); closeSheet(); setState('idle'); news('Progress erased',''); });
});

/* ---------- Boot ---------- */
function boot(data){
  if (data && data.save) load(data.save);
  migrateRecords();
  if ((save.pending||[]).length){ const got=save.pending.splice(0); got.forEach(grant); persist(); setTimeout(()=>news('Your Tacklegram order arrived','gold'),800); }
  resize(); coinShown=save.coins; $('coins').textContent=save.coins.toLocaleString(); updateHud(); accrueTips(); setState('idle'); kitchenUnlockCheck(true);
  requestAnimationFrame(t=>{ last=t; requestAnimationFrame(frame); });
  snapshot('Start of a session'); protectStorage(); introStart(); sheetSwipe();
}
window.claude?.hot?.snapshot?.(()=>({save}));
const hot=window.claude?.hot;
if (hot?.ready) hot.ready(boot); else boot(hot?.data ?? {});
})();
</script>
