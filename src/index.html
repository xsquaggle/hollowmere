<div id="aqua" hidden></div>
<div id="shack" hidden></div>
<div id="intro" hidden></div>
<div id="ending" hidden></div>
<div id="news" role="status" aria-live="polite"></div>
<div id="kitchen" hidden></div>
<div id="mapLayer" hidden></div>

<div id="card" hidden role="dialog" aria-label="Catch">
  <div class="card-top"><span class="rarity" id="cRarity">Common</span><span id="cPips"></span><span class="beh" id="cBeh">Darter</span><span class="stamp" id="cNew">NEW</span><span class="spacer"></span><span id="cQ"></span></div>
  <canvas id="cFish"></canvas>
  <div class="c-name"><h2 id="cName">Copper Perch</h2><span class="rec-stamp" id="cRec" hidden>Personal<br>record</span></div>
  <p id="cPB" hidden></p>
  <div class="facts">
    <div><span class="k">Length</span><span id="cSize">0 cm</span></div>
    <div><span class="k">Weight</span><span id="cW">0 g</span></div>
    <div><span class="k">Value</span><span id="cValue">0</span></div>
  </div>
  <p id="cTags"></p>
  <p id="cLore"></p>
  <div class="card-actions"><button class="btn" id="cSell" type="button">Sell · +0</button><button class="btn" id="cKeep" type="button">Keep</button></div>
  <button id="cTank" type="button" hidden>Send straight to the aquarium</button>
  <button id="cMount" type="button" hidden>Mount it on the trophy wall</button>
  <p id="cAuto">Selling in a moment · tap Keep to keep it</p>

<div id="haul" hidden role="dialog" aria-label="Treasure"></div>
<div id="note" hidden></div>

<div id="bag" hidden></div>
